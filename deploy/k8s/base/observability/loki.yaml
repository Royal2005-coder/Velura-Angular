apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\ncommon:\n  path_prefix:\
    \ /loki-data\n  storage:\n    filesystem:\n      chunks_directory: /loki-data/chunks\n\
    \      rules_directory: /loki-data/rules\n  replication_factor: 1\n  ring:\n \
    \   instance_addr: 127.0.0.1\n    kvstore:\n      store: inmemory\nschema_config:\n\
    \  configs:\n  - from: '2024-01-01'\n    store: tsdb\n    object_store: filesystem\n\
    \    schema: v13\n    index:\n      prefix: index_\n      period: 24h\nlimits_config:\n\
    \  retention_period: 336h\n  allow_structured_metadata: true\ncompactor:\n  working_directory:\
    \ /loki-data/retention\n  retention_enabled: true\n  delete_request_store: filesystem\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: observability
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: loki
        image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
        ports:
        - name: http
          containerPort: 3100
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 384Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
        args:
        - -config.file=/etc/loki/loki.yaml
        volumeMounts:
        - name: data
          mountPath: /loki-data
        - name: config
          mountPath: /etc/loki
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: loki-data
      - name: config
        configMap:
          name: loki-config
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
