apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: observability
data:
  config.yaml: |
    model_list:
      - model_name: gemini-1.5-flash
        litellm_params:
          model: gemini/gemini-1.5-flash
          api_key: os.environ/GEMINI_API_KEY
      - model_name: gemini-1.5-pro
        litellm_params:
          model: gemini/gemini-1.5-pro
          api_key: os.environ/GEMINI_API_KEY
      - model_name: text-embedding-local
        litellm_params:
          model: openai/clip-vit-b-32
          api_base: http://ai-clip.ai.svc:8000/v1
          api_key: "local-worker-key"
    litellm_settings:
      drop_params: true
      telemetry: false
    general_settings:
      master_key: "sk-velura-master-gateway-key-2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: observability
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: velura-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:main-v1.49.0
        imagePullPolicy: IfNotPresent
        args:
          - "--config"
          - "/etc/litellm/config.yaml"
          - "--port"
          - "4000"
          - "--num_workers"
          - "2"
        ports:
          - name: http
            containerPort: 4000
        env:
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: gemini-credentials
                key: api-key
                optional: true
          - name: LITELLM_MASTER_KEY
            value: "sk-velura-master-gateway-key-2026"
          - name: OPENAI_API_KEY
            value: "dummy-openai-key-for-local-routing"
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
          - name: config
            mountPath: /etc/litellm
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-credentials
  namespace: observability
type: Opaque
stringData:
  api-key: "placeholder-gemini-key"
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: observability
  labels:
    app.kubernetes.io/name: litellm
spec:
  type: NodePort
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30400
      name: http
  selector:
    app: litellm
