router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 0
  allowed_fails: 2
  cooldown_time: 60
litellm_settings:
  callbacks: [prometheus]
  # LiteLLM 1.79 reads this setting here, not under general_settings.
  require_auth_for_metrics_endpoint: true
  telemetry: false
  request_timeout: 45
  num_retries: 2
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
