apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- velura-api.yaml
- velura-admin.yaml
- velura-storefront.yaml
configMapGenerator:
  - name: velura-api-config
    namespace: velura
    literals:
      - NODE_ENV=production
      - RELEASE_REVISION=b3df517c1daa2c4147ca7c5db0a32213a748c683
      - PORT=3000
      - CORS_ORIGIN=https://velura.royalai.dev,https://admin.royalai.dev,https://shop.royalai.dev
      - STOREFRONT_ORIGIN=https://velura.royalai.dev
      - S3_ENDPOINT=http://s3-service.storage.svc:9000
      - LITELLM_ENDPOINT=http://litellm.observability.svc:4000
      - GEMINI_MODEL=commerce-text
      - GEMINI_STYLIST_MODEL=commerce-text
      - GEMINI_EMBEDDING_MODEL=commerce-embedding
      - LITELLM_IMAGE_MODEL=commerce-image-edit
      - AI_CLUSTER_ENDPOINT=http://ai-worker.ai-staging.svc:8000
      - AI_ENGINE_MODE=cluster
      - AI_ENABLE=true
      - AI_VERIFIED_TASKS=image_quality,image_embedding,virtual_try_on,product_image_enhance
      - AI_CATALOG_IMAGE_HOSTS=cdn.jsdelivr.net,images.velura.vn
      - AI_PRIVATE_ROOT=/app/scratch/ai-private
      - VERCEL=0
