apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: velura-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/boygia757-netizen/velura-project.git
  ref:
    branch: develop
  secretRef:
    name: velura-git-credentials
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velura-infra
  namespace: flux-system
spec:
  interval: 2m
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: velura-repo
  path: "./deploy/k8s/base"
  prune: true
  wait: true
  timeout: 3m
