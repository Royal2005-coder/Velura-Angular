# 6. kong: Declarative API Gateway proxying /rest/v1, /auth/v1, /storage/v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: database
  labels:
    app: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
      - name: kong
        image: nginxinc/nginx-unprivileged:alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: kong-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: kong-config
        configMap:
          name: kong-declarative-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: database
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: admin
    port: 8001
    targetPort: 8001
