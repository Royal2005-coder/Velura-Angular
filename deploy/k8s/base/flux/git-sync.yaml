apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: velura-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/Royal2005-coder/Velura-Angular.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velura-root
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: velura-repo
  path: ./deploy/k8s/clusters/production
  # Root owns Flux configuration; infrastructure owns platform resources.
  # Do not wait on child owners that depend on infrastructure readiness.
  wait: false
  prune: true
  deletionPolicy: Orphan
  timeout: 2m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velura-infra
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: velura-repo
  path: ./deploy/k8s/overlays/infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # Platform adoption is complete; subsequent main changes reconcile continuously.
  suspend: false
  prune: true
  deletionPolicy: Orphan
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velura-production
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: velura-repo
  path: ./deploy/k8s/overlays/production
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: velura-infra
  # The publisher pins PR enables this after signed-main evidence is available.
  suspend: false
  prune: true
  deletionPolicy: Orphan
  wait: true
  timeout: 5m
