<svg style="display: none;">
  <symbol id="icon-search" viewBox="0 0 16 16">
    <circle cx="7.33" cy="7.33" r="5.33" stroke="currentColor" stroke-width="1.33" fill="none" />
    <path d="M14 14l-2.87-2.87" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" />
  </symbol>
  <symbol id="icon-heart" viewBox="0 0 20 20">
    <path d="M10 17.5l-5.83-5.83a4.17 4.17 0 115.83-5.83 4.17 4.17 0 115.83 5.83L10 17.5z" stroke="currentColor" stroke-width="1.55" fill="none" />
  </symbol>
  <symbol id="icon-cart" viewBox="0 0 24 24">
    <path d="M2 3h2.5l2.7 12.36a2 2 0 0 0 1.95 1.57h8.6a2 2 0 0 0 1.96-1.61L21.5 7H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="10" cy="20.5" r="1.4" stroke="currentColor" stroke-width="1.6" fill="none" />
    <circle cx="17" cy="20.5" r="1.4" stroke="currentColor" stroke-width="1.6" fill="none" />
  </symbol>
  <symbol id="icon-user" viewBox="0 0 20 20">
    <path d="M10 9.17a3.33 3.33 0 100-6.67 3.33 3.33 0 000 6.67zM15.83 17.5v-1.67a3.33 3.33 0 00-3.33-3.33H7.5a3.33 3.33 0 00-3.33 3.33V17.5" stroke="currentColor" stroke-width="1.67" fill="none" />
  </symbol>
  <symbol id="icon-facebook" viewBox="0 0 24 24">
    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" fill="currentColor" />
  </symbol>
  <symbol id="icon-instagram" viewBox="0 0 24 24">
    <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="currentColor" stroke-width="2" fill="none" />
    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke="currentColor" stroke-width="2" fill="none" />
    <line x1="17.5" y1="6.5" x2="17.5" y2="6.5" stroke="currentColor" stroke-width="2" />
  </symbol>
  <symbol id="icon-map-pin" viewBox="0 0 24 24">
    <path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2" fill="none" />
  </symbol>
  <symbol id="icon-phone" viewBox="0 0 24 24">
    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1 2 1.72z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </symbol>
  <symbol id="icon-mail" viewBox="0 0 24 24">
    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0 1.1.9-2 2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2" fill="none" />
  </symbol>
  <symbol id="icon-bell" viewBox="0 0 24 24">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </symbol>
</svg>

<header class="site-header">
  <div class="container site-header__container-grid">
    <div class="header-col header-col--left">
      <a routerLink="/" class="site-header__logo-group">
        <div class="logo-flower-crop">
          <img src="/assets/images/logo.png" alt="Velura logo" class="logo-flower-img" />
        </div>
        <span class="logo-brand-name">VELURA</span>
      </a>
    </div>

    <div class="header-col header-col--center">
      <div class="center-row center-row--top">
        <div class="header-info-item header-info-item--hotline">
          <svg class="icon icon-phone" aria-hidden="true" style="width: 16px; height: 16px; margin-right: 4px;"><use href="#icon-phone"></use></svg>
          <span>HOTLINE: <span class="highlight-text">1900 1212</span></span>
        </div>
        <a routerLink="/contact" fragment="store-map" class="header-info-item header-info-item--shops">
          <svg class="icon icon-map-pin" aria-hidden="true" style="width: 16px; height: 16px; margin-right: 4px;"><use href="#icon-map-pin"></use></svg>
          <span>HỆ THỐNG CỬA HÀNG</span>
        </a>
        <label class="site-header__search">
          <svg class="icon icon-search" aria-hidden="true" style="width: 14px; height: 14px;"><use href="#icon-search"></use></svg>
          <input type="search" class="js-search-input" placeholder="Tìm kiếm sản phẩm..." aria-label="Tìm kiếm sản phẩm" (keydown)="onSearch($event)" />
        </label>
      </div>
      <nav class="center-row center-row--bottom site-header__nav" aria-label="Chính" [class.is-open]="navOpen()">
        <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Trang chủ</a>
        <a routerLink="/products" routerLinkActive="is-active" class="nav-link">Sản phẩm</a>
        <a routerLink="/collections" routerLinkActive="is-active" class="nav-link">Bộ sưu tập</a>
        <a routerLink="/ai/suggestions" routerLinkActive="is-active" class="nav-link nav-link--highlight">Gợi ý AI ✨</a>
        <a routerLink="/chatbot" routerLinkActive="is-active" class="nav-link">Chatbot</a>
        <a routerLink="/blog" routerLinkActive="is-active" class="nav-link">Blog</a>
        <a routerLink="/about" routerLinkActive="is-active" class="nav-link">Về chúng tôi</a>
      </nav>
    </div>

    <div class="header-col header-col--right">
      <a class="header-action-btn" routerLink="/wishlist" aria-label="Yêu thích">
        <span class="btn-icon-wrapper">
          <svg class="icon icon-heart" aria-hidden="true" style="width: 24px; height: 24px;"><use href="#icon-heart"></use></svg>
          <span class="wishlist-badge">{{ wishlistCount() }}</span>
        </span>
      </a>
      <a class="header-action-btn" routerLink="/cart" aria-label="Giỏ hàng">
        <span class="btn-icon-wrapper">
          <svg class="icon icon-cart" aria-hidden="true" style="width: 24px; height: 24px;"><use href="#icon-cart"></use></svg>
          <span class="cart-badge">{{ cartCount() }}</span>
        </span>
      </a>
      <div class="header-action-btn header-account-dropdown">
        <span class="btn-icon-wrapper" style="cursor: pointer;">
          @if (isLoggedIn() && avatarUrl()) {
            <img class="header-avatar" [src]="avatarUrl()!" [alt]="displayName()" width="24" height="24" />
          } @else {
            <svg class="icon icon-user" style="width: 24px; height: 24px;"><use href="#icon-user"></use></svg>
          }
        </span>
        <div class="account-dropdown-menu">
          <div class="account-dropdown-arrow"></div>
          @if (!isLoggedIn()) {
            <a routerLink="/auth/signin" class="account-dropdown-item">Đăng nhập</a>
            <a routerLink="/auth/signup" class="account-dropdown-item">Đăng ký</a>
          } @else {
            <span class="account-dropdown-item" aria-current="true">{{ displayName() }}</span>
            <a routerLink="/account/profile" class="account-dropdown-item">Tài khoản</a>
            <button type="button" class="account-dropdown-item" (click)="logout()">Đăng xuất</button>
          }
        </div>
      </div>
      <button class="menu-toggle" type="button" aria-label="Mở menu" [attr.aria-expanded]="navOpen()" (click)="toggleNav()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
