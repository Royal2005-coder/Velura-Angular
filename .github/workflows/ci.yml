name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      recovery:
        description: 'Type release-main to rebuild, scan and sign the current main revision after all checks'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  npm_config_fund: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
      production: ${{ steps.changes.outputs.production }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workspace and safe input contract
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          test -f apps/api/src/server.ts
          test -f apps/admin-ng/package.json
          test -f apps/admin-erp-ng/package.json
          test -f apps/user-ng/package.json
          if printf '%s\n' "$MESSAGE" "$TITLE" | grep -qiE '\[skip ci\]|\[ci skip\]'; then exit 1; fi
          if grep -R --exclude-dir=.git --exclude-dir=node_modules --include='*.pem' --include='*.key' -n 'BEGIN .*PRIVATE KEY' .; then exit 1; fi
          if grep -R --include='*.ts' -n '@ts-nocheck' apps/api; then exit 1; fi
          if git grep -qE 'AGE-SECRET-KEY-1[0-9A-Z]{50,}' -- .; then
            echo 'Private age identity found; content withheld' >&2
            exit 1
          fi
      - name: Detect application release changes
        id: changes
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          RECOVERY: ${{ inputs.recovery }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$RECOVERY" = release-main
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'production=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'production=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BEFORE" HEAD > changed-paths.txt
          if grep -qE '^(apps/|packages/|database/migrations/|scripts/(run-migrations|supabase-project)\.mjs$|package(-lock)?\.json$|deploy/docker/)' changed-paths.txt; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^deploy/k8s/overlays/production/' changed-paths.txt || grep -qx 'deploy/releases/production.json' changed-paths.txt; then
            echo 'production=true' >> "$GITHUB_OUTPUT"
          else
            echo 'production=false' >> "$GITHUB_OUTPUT"
          fi
  validate-pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production and PR contract
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          SRC: ${{ github.head_ref }}
          TGT: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$TGT" = main ] && [ "$SRC" != develop ]; then exit 1; fi
          printf '%s\n' "$TITLE" | grep -Eqi '^(Draft:[[:space:]]*)?KAN-[0-9]+'
          printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*##[[:space:]]*(Why|Tại sao)'
          case "$SRC" in feature/KAN-*|hotfix/KAN-*|develop) ;; *) exit 1;; esac
  test-api:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run typecheck:api
      - run: npm run test:api
      - run: node --test tools/ops/velura-ops.test.mjs
      - run: node --test scripts/supabase-project.test.mjs
  test-angular:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run test:ng
  test-ai-worker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai-worker/requirements-test.txt
      - run: python -m pip install -r apps/ai-worker/requirements-test.txt
      - run: python -m unittest discover -s apps/ai-worker -p 'test_*.py'
      - run: python tools/ops/k3s-sqlite-backup.test.py
  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run build:api && npm run build:user && npm run build:admin && npm run build:admin-erp
  manifests:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '1.23.8', cache: false}
      - name: Install explicit manifest rendering dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify release tooling behavior
        run: python -m unittest discover -s scripts -p test_release_images.py
      - name: Verify platform admission regression checks
        run: python -m unittest discover -s scripts -p test_platform_contract.py
      - name: Verify ciphertext-only Secret regression checks
        run: python -m unittest discover -s scripts -p test_secret_contract.py
      - name: Verify production-only workflow ownership and release gates
        run: python -m unittest discover -s scripts -p test_mvp_pipeline.py
      - name: Reject duplicate YAML keys and render each isolated overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, yaml
          from scripts.platform_contract import validate_platform
          from scripts.secret_contract import validate_secret_files
          validate_secret_files()
          class UniqueLoader(yaml.SafeLoader):
              pass
          def mapping(loader, node, deep=False):
              keys = [loader.construct_object(key, deep=deep) for key, value in node.value]
              if len(keys) != len(set(keys)):
                  raise ValueError('Duplicate YAML mapping key')
              return yaml.SafeLoader.construct_mapping(loader, node, deep=deep)
          UniqueLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)
          paths = [Path('.github/workflows/ci.yml'), Path('.sops.yaml'), *Path('deploy/k8s').rglob('*.yaml')]
          for path in paths:
              list(yaml.load_all(path.read_text(), Loader=UniqueLoader))
          owners = {}
          platform_objects = []
          app_deployments = {'velura-api', 'velura-storefront', 'velura-admin', 'velura-admin-erp'}
          for path in ('deploy/k8s/clusters/production', 'deploy/k8s/overlays/production', 'deploy/k8s/overlays/infrastructure', 'deploy/k8s/optional/ai-worker'):
              rendered = subprocess.run(['kustomize', 'build', path], check=True, capture_output=True, text=True).stdout
              objects = list(yaml.load_all(rendered, Loader=UniqueLoader))
              if path.startswith('deploy/k8s/overlays/'):
                  platform_objects.extend(objects)
              if not objects: raise ValueError('No rendered resources')
              for item in objects:
                  metadata = item.get('metadata', {})
                  if path.startswith(('deploy/k8s/overlays/', 'deploy/k8s/clusters/')):
                      identity = (item['apiVersion'], item['kind'], metadata.get('namespace', ''), metadata['name'])
                      if identity in owners:
                          raise ValueError(f'Resource ownership overlaps: {identity} in {owners[identity]} and {path}')
                      owners[identity] = path
                  if item.get('kind') == 'Deployment' and metadata.get('name') in app_deployments:
                      name = metadata['name']
                      containers = item['spec']['template']['spec']['containers']
                      application = [container for container in containers if container.get('name') == name]
                      if len(application) != 1 or not re.fullmatch(r'ghcr\.io/royal2005-coder/' + re.escape(name) + r'(?::[^@\s]+)?@sha256:[a-f0-9]{64}', application[0].get('image', '')):
                          raise ValueError(f'Application deployment must pin its canonical image digest: {name} in {path}')
                  if item.get('kind') == 'ConfigMap':
                      for name, value in item.get('data', {}).items():
                          if name.endswith('.yaml'): list(yaml.load_all(value, Loader=UniqueLoader))
          validate_platform(platform_objects)
          PY
      - name: Require signed-main provenance or unchanged suspended legacy bootstrap
        if: github.event_name == 'pull_request' || hashFiles('deploy/releases/production.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/release-images.py validate-production "$BASE_SHA"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
        if: hashFiles('deploy/releases/production.json') != ''
      - name: Verify exact production image signatures before reviewed pins can merge
        if: hashFiles('deploy/releases/production.json') != ''
        run: |
          set -euo pipefail
          python scripts/release-images.py verified-snapshot production > signed-production.json
          revision=$(jq -r .revision signed-production.json)
          build_id=$(jq -r .buildId signed-production.json)
          for app in api storefront admin admin-erp; do
            image=$(jq -r --arg app "$app" '.images[$app]' signed-production.json)
            cosign verify --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com --annotations "release-revision=$revision" --annotations "release-build-id=$build_id" "$image"
          done
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reject duplicate new migration numbers
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          numbers = [int(re.match(r'\d+', p.name)[0]) for p in Path('database/migrations').glob('*.sql') if re.match(r'\d+', p.name)]
          duplicates = [n for n,c in Counter(numbers).items() if n >= 25 and c > 1]
          if duplicates: raise SystemExit(f'Duplicate migrations: {duplicates}')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Parse chatbot release SQL and require its dependency chain
        run: |
          python -m pip install pglast==7.21
          python - <<'PY'
          from pathlib import Path
          from pglast import ast, parse_sql
          migrations = Path('database/migrations')
          for number in ('054', '056', '057', '058'):
              files = list(migrations.glob(f'{number}_*.sql'))
              if len(files) != 1: raise SystemExit(f'Missing or ambiguous prerequisite migration {number}')
              for raw in parse_sql(files[0].read_text(encoding='utf-8')):
                  if isinstance(raw.stmt, ast.CreateFunctionStmt):
                      options = {option.defname: option.arg for option in raw.stmt.options}
                      if options.get('language') and options['language'].sval == 'sql':
                          parse_sql(options['as'][0].sval)
          reports = next(migrations.glob('058_*.sql')).read_text(encoding='utf-8')
          if 'public.chat_schema_readiness()' not in reports:
              raise SystemExit('Chatbot release requires read-only installed-schema readiness RPC')
          PY
  note-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate-pr-contract, test-api, test-angular, test-ai-worker, build, migrations, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = '## Trace log (required CI note)';
            const body = `${marker}\n- Revision: ${context.sha}\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const args = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, args);
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...args, body});
  promote-main:
    # MVP: green integration opens CI-gated sync/promotion PRs, never direct branch writes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.VELURA_AUTO_PROMOTE_MAIN == 'true'
    needs: [validate, test-api, test-angular, test-ai-worker, build, migrations, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Decide whether integration needs a main sync or promotion
        id: target
        run: |
          set -euo pipefail
          git fetch origin main develop
          if [ "$(git rev-parse origin/develop)" != "$GITHUB_SHA" ] || git diff --quiet origin/main HEAD; then
            echo 'action=none' >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor origin/main HEAD; then
            echo 'action=promote' >> "$GITHUB_OUTPUT"
          else
            echo 'action=sync' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate repository-scoped PR automation
        if: steps.target.outputs.action != 'none'
        id: app
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: node scripts/release-app-token.mjs
      - name: Open or queue the green integration PR
        if: steps.target.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ steps.target.outputs.action }}
        run: |
          set -euo pipefail
          gh auth setup-git
          merge_when_required_green() {
            local target="$1"
            local attempt
            for attempt in $(seq 1 20); do
              gh pr checks "$target" --required --watch --interval 30 || true
              if gh pr merge "$target" --merge; then
                return 0
              fi
              sleep 30
            done
            return 1
          }
          if [ "$ACTION" = sync ]; then
            main_sha=$(git rev-parse origin/main)
            branch="feature/KAN-32-sync-main-${main_sha:0:12}-${GITHUB_SHA:0:12}"
            existing=$(gh pr list --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              merge_when_required_green "$existing"
              exit 0
            fi
            git switch -c "$branch"
            git config user.name 'velura-release[bot]'
            git config user.email 'velura-release[bot]@users.noreply.github.com'
            git merge --no-ff origin/main -m 'KAN-32 why: synchronize approved main ancestry before integration promotion'
            git push origin "$branch"
            pr=$(gh pr create --base develop --head "$branch" --title 'KAN-32: sync main ancestry for green integration promotion' --body '## Why
          Keep develop current with approved main before MVP promotion. Required PR checks still gate this merge. Resolve conflicts through Git, never through cluster edits.
          cc @Royal2005-coder @trandiemquynhqw-maker @uyenntd23406-svg')
          else
            pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
            if [ -z "$pr" ]; then
              pr=$(gh pr create --base main --head develop --title 'KAN-32: promote green integration to MVP main' --body '## Why
          Promote tested integration through the protected main PR. Main publishes signed application images when source changes; reviewed production pins are reconciled by Flux.
          cc @Royal2005-coder @trandiemquynhqw-maker @uyenntd23406-svg')
            fi
          fi
          # The job's own check is not required; retry because a new PR may not have registered checks yet.
          merge_when_required_green "$pr"
      - name: Revoke short-lived App installation token
        if: ${{ always() && steps.app.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE installation/token
  deploy-production:
    # Build artifacts only; never write cluster state. Recovery repeats every gate on current main.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.validate.outputs.publish == 'true'
    needs: [validate, test-api, test-angular, test-ai-worker, build, migrations, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, storefront, admin, admin-erp, ai-worker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python -m pip install PyYAML==6.0.2
      - name: Resolve canonical image repository
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${OWNER,,}/velura-$APP" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Resolve immutable worker Python base
        if: matrix.app == 'ai-worker'
        id: python
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect python:3.11.13-slim-bookworm --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=python:3.11.13-slim-bookworm@$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: build
        with:
          context: .
          file: deploy/docker/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PYTHON_IMAGE=${{ steps.python.outputs.image }}
            RELEASE_REVISION=${{ github.sha }}
            RELEASE_BUILD_ID=${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
          sbom: true
      - name: Install checksum-verified scanner release
        id: scanner
        # Install a checksum-pinned scanner, not a mutable upstream-main install script.
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 120 https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Scan exact published digest
        id: scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        env:
          # ai-worker ships CUDA/ONNX runtimes larger than Trivy's 5m default walk budget.
          TRIVY_TIMEOUT: '20m'
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: scan-${{ matrix.app }}.json
      - name: Generate SPDX SBOM even when the security gate fails
        id: sbom
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.scanner.outcome == 'success' }}
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        env:
          TRIVY_TIMEOUT: '20m'
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output: sbom-${{ matrix.app }}.json
          exit-code: '0'
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign and attest immutable release
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          APP: ${{ matrix.app }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cosign sign --yes --annotations "release-revision=$RELEASE_SHA" --annotations "release-build-id=$RELEASE_BUILD_ID" "$IMAGE"
          cosign attest --yes --type spdxjson --predicate "sbom-$APP.json" "$IMAGE"
          printf '%s\n' "$IMAGE" > "image-$APP.txt"
          printf '%s\n' "$RELEASE_BUILD_ID" > "build-id-$APP.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.app }}
          path: |
            image-${{ matrix.app }}.txt
            build-id-${{ matrix.app }}.txt
          if-no-files-found: error
          retention-days: 90
      - name: Sanitize scan and SBOM diagnostics without leaking secret matches
        if: always()
        env:
          SCANNER_OUTCOME: ${{ steps.scanner.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python scripts/release-images.py sanitize '${{ matrix.app }}'
      - name: Always retain sanitized release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnostics-${{ matrix.app }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 90
  promote-images:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.validate.outputs.publish == 'true'
    needs: [validate, deploy-production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install PyYAML==6.0.2
      - name: Authenticate repository-scoped PR automation
        id: app
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: node scripts/release-app-token.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Open signed production pins PR with PR checks enabled
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="feature/KAN-32-production-${RELEASE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'velura-release[bot]'
          git config user.email 'velura-release[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff origin/main -m 'KAN-32 why: keep production promotion ancestry current with approved main'
          python scripts/release-images.py direct release "$RELEASE_SHA" "$RELEASE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          git add deploy/k8s/overlays/production/kustomization.yaml deploy/k8s/overlays/production/release-revision.yaml deploy/releases/production.json deploy/k8s/base/flux/git-sync.yaml
          gh auth setup-git
          if ! git diff --cached --quiet; then
            git commit -m 'KAN-32 why: promote scanned signed main application digests to MVP production'
            git push origin "$branch"
            pr=$(gh pr create --repo "$GH_REPO" --base develop --head "$branch" --title 'KAN-32: promote signed main digests to MVP production' --body "$(printf '## Why\nPromote the exact scanned/signed images built from approved main revision %s. CI validates publisher evidence and Cosign identities; Flux applies only reviewed production pins after develop is promoted to main. Staging is not part of the MVP release path. Optional worker remains a separate owner-reviewed rollout. Publisher run: %s/%s/actions/runs/%s\ncc @Royal2005-coder @trandiemquynhqw-maker @uyenntd23406-svg' "$RELEASE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")")
            gh pr merge "$pr" --auto --merge
          fi
          git switch develop
          python scripts/release-images.py worker release
          worker_branch="feature/KAN-32-worker-${RELEASE_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$worker_branch"
          git add deploy/k8s/optional/ai-worker/worker.yaml deploy/k8s/optional/ai-worker/provision-weights.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'KAN-32 why: review optional worker digest without enabling or scaling it'
            git push origin "$worker_branch"
            gh pr create --repo "$GH_REPO" --base develop --head "$worker_branch" --title 'KAN-32: pin optional signed worker release' --body "$(printf '## Why\nUpdate only the optional worker and weights-provision image references from scanned signed main release %s. This does not add the worker to app overlays, enable AI, change replicas, or certify GPU/model readiness. Owner reviews the separate optional rollout prerequisites. Release run: %s/%s/actions/runs/%s' "$RELEASE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          fi
      - name: Revoke short-lived App installation token
        if: ${{ always() && steps.app.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method DELETE installation/token
  verify-production:
    # Root Flux applies reviewed pins; this job only verifies signed artifacts and runtime.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.production == 'true' && needs.validate.outputs.publish == 'false' && vars.VELURA_VERIFY_PRODUCTION == 'true'
    needs: [validate, test-api, test-angular, test-ai-worker, build, migrations, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: python -m pip install PyYAML==6.0.2
      - name: Require the exact production bundle's successful main publisher provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release-images.py validate-production
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Verify the exact signed production digests
        run: |
          set -euo pipefail
          python scripts/release-images.py verified-snapshot production > production-release.json
          revision=$(jq -r .revision production-release.json)
          build_id=$(jq -r .buildId production-release.json)
          for app in api storefront admin admin-erp; do
            image=$(jq -r --arg app "$app" '.images[$app]' production-release.json)
            cosign verify --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com --annotations "release-revision=$revision" --annotations "release-build-id=$build_id" "$image"
          done
      - name: Require owner-provisioned production chatbot schema without writes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_CA_PEM: ${{ secrets.SUPABASE_DB_CA_CERT }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$DB_CA_PEM"
          ca=$(mktemp)
          trap 'rm -f "$ca"' EXIT
          chmod 600 "$ca"
          printf '%s\n' "$DB_CA_PEM" > "$ca"
          SUPABASE_DB_CA_CERT="$ca" node scripts/run-migrations.mjs --check --require-chatbot-schema
      - name: Verify production build identities and read-only health
        env:
          VERIFY_TOKEN: ${{ secrets.PRODUCTION_VERIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ACCESS_ENABLED: ${{ vars.VELURA_CF_ACCESS_ENABLED }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$VERIFY_TOKEN"
          access_headers=()
          if [ "$ACCESS_ENABLED" = true ]; then
            test -n "$CF_ACCESS_CLIENT_ID"
            test -n "$CF_ACCESS_CLIENT_SECRET"
            test "$CF_ACCESS_CLIENT_ID" != not-enforced
            test "$CF_ACCESS_CLIENT_SECRET" != not-enforced
            access_headers=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          python scripts/release-images.py verified-snapshot production > production-release.json
          expected=$(jq -r .revision production-release.json)
          expected_build=$(jq -r .buildId production-release.json)
          expected_project=$(node --input-type=module - <<'JS'
          import { requireProductionProjectRef } from './scripts/supabase-project.mjs';
          console.log(requireProductionProjectRef(process.env.PRODUCTION_SUPABASE_PROJECT_REF));
          JS
          )
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 15 -H "Authorization: Bearer $VERIFY_TOKEN" "${access_headers[@]}" https://admin.royalai.dev/api/ops/revision > revision.json \
              && jq -e --arg expected "$expected" --arg build "$expected_build" --arg project "$expected_project" '.ready == true and .checks.chatbotSchema == true and .revision == $expected and .buildRevision == $expected and .buildId == $build and .databaseProjectRef == $project' revision.json \
              && curl --fail --silent --show-error --max-time 15 "${access_headers[@]}" https://admin.royalai.dev/release.json | jq -e --arg expected "$expected" --arg build "$expected_build" '.revision == $expected and .buildId == $build' \
              && curl --fail --silent --show-error --max-time 15 https://velura.royalai.dev/release.json | jq -e --arg expected "$expected" --arg build "$expected_build" '.revision == $expected and .buildId == $build' \
              && curl --fail --silent --show-error --max-time 15 https://velura.royalai.dev/api/health \
              && curl --fail --silent --show-error --max-time 15 https://velura.royalai.dev/api/v1/webhooks/carrier | jq -e '.surface == "carrier-webhook" and ((.statuses | index("delivered")) != null)' \
              && carrier_code=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' -X POST https://velura.royalai.dev/api/v1/webhooks/carrier/ghn) \
              && { [ "$carrier_code" = 401 ] || [ "$carrier_code" = 503 ]; } \
              && curl --fail --silent --show-error --max-time 15 "${access_headers[@]}" https://admin-erp.royalai.dev/release.json | jq -e --arg expected "$expected" --arg build "$expected_build" '.revision == $expected and .buildId == $build' \
              && curl --fail --silent --show-error --max-time 15 https://admin-erp.royalai.dev/api/health \
              && curl --fail --silent --show-error --max-time 30 https://velura.royalai.dev/api/user/products > catalog.json \
              && jq -e 'type == "array" and length > 0 and all(.[]; (.product_id | type == "string") and (.name | type == "string"))' catalog.json > /dev/null \
              && curl --fail --silent --show-error --max-time 30 "https://velura.royalai.dev/api/user/products/$(jq -r '.[0].product_id' catalog.json)" | jq -e '.product_id != null and (.variants | type == "array")' > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production build identities did not converge' >&2
          exit 1
