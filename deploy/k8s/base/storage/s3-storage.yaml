apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-storage-pvc
  namespace: storage
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-storage
  namespace: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-storage
  template:
    metadata:
      labels:
        app: s3-storage
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: s3-storage
        image: chrislusf/seaweedfs:3.85
        ports:
        - name: http
          containerPort: 9000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 750m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
        command:
        - weed
        args:
        - server
        - -s3
        - -dir=/data
        - -s3.port=9000
        - -s3.config=/etc/seaweedfs/s3.json
        - -volume.max=8
        - -master.volumeSizeLimitMB=1024
        volumeMounts:
        - name: data
          mountPath: /data
        - name: credentials
          mountPath: /etc/seaweedfs
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: s3-storage-pvc
      - name: credentials
        secret:
          secretName: seaweedfs-s3-identities
          items:
          - key: s3.json
            path: s3.json
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: s3-service
  namespace: storage
spec:
  type: ClusterIP
  selector:
    app: s3-storage
  ports:
  - name: http
    port: 9000
    targetPort: 9000
  - name: filer
    port: 8888
    targetPort: 8888
