apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- velura-api.yaml
- velura-admin.yaml
- velura-admin-erp.yaml
- velura-storefront.yaml
configMapGenerator:
  - name: velura-api-config
    namespace: velura
    literals:
      - NODE_ENV=production
      # Without this the 24h payment-expiry cleaner never runs, so an abandoned checkout holds
      # reserved_quantity and burns a voucher's used_count indefinitely.
      - ORDER_AUTOMATION_MODE=on
      # VNPay/MoMo chạy ở sandbox có ký, vì credential merchant thật chưa được cấp. An toàn tiền nằm
      # ở migration 112 (mỗi phiên thanh toán lưu môi trường của nó; callback/verify/refund sai môi
      # trường bị DB từ chối trước khi động tới số dư), nên để sandbox chạy được không phải đánh đổi.
      # Có VNPAY_*/MOMO_* thật thì credential thật thắng, simulator tự tắt.
      - PAYMENT_GATEWAY_ENVIRONMENT=sandbox
      - PAYMENT_GATEWAY_SIMULATOR=on
      - RELEASE_REVISION=b3df517c1daa2c4147ca7c5db0a32213a748c683
      - PORT=3000
      - CORS_ORIGIN=https://velura.royalai.dev,https://admin.royalai.dev,https://shop.royalai.dev,https://admin-erp.royalai.dev
      - STOREFRONT_ORIGIN=https://velura.royalai.dev
      # Origin công khai của chính API, đã đo: https://velura.royalai.dev/api/user/payments/providers
      # trả 200 (storefront gọi same-origin với apiUrl ''). Không có nó thì mọi cổng hosted bị tắt vì
      # không dựng được ReturnUrl/IPN URL công khai mà nhà mạng gọi lại, và QR của khách vô dụng.
      - API_PUBLIC_ORIGIN=https://velura.royalai.dev
      - S3_ENDPOINT=http://s3-service.storage.svc:9000
      - LITELLM_ENDPOINT=http://litellm.observability.svc:4000
      - GEMINI_MODEL=commerce-text
      - GEMINI_STYLIST_MODEL=commerce-text
      - GEMINI_EMBEDDING_MODEL=commerce-embedding
      - LITELLM_IMAGE_MODEL=commerce-image-edit
      - AI_CLUSTER_ENDPOINT=http://ai-worker.ai-staging.svc:8000
      - AI_ENGINE_MODE=cluster
      - AI_ENABLE=true
      - AI_VERIFIED_TASKS=image_quality,image_embedding,virtual_try_on,product_image_enhance
      - AI_CATALOG_IMAGE_HOSTS=cdn.jsdelivr.net,images.velura.vn
      - AI_PRIVATE_ROOT=/app/scratch/ai-private
      - AI_STUDIO_ASSET_ROOT=/app/studio-assets
      - AI_STUDIO_ASSETS={"female-front-v1":{"file":"female-front-v1.png","label":"Người mẫu Nữ Studio Chuẩn","gender":"female","occasion":"basic","season":"all","badge":"Studio","licensed":true},"female-spring-v1":{"file":"female-front-v1.png","label":"Người mẫu Nữ Mùa Xuân","gender":"female","occasion":"spring","season":"spring","badge":"Mùa Xuân","licensed":true},"female-summer-v1":{"file":"female-front-v1.png","label":"Người mẫu Nữ Mùa Hạ","gender":"female","occasion":"summer","season":"summer","badge":"Mùa Hạ","licensed":true},"female-autumn-v1":{"file":"female-front-v1.png","label":"Người mẫu Nữ Mùa Thu","gender":"female","occasion":"autumn","season":"autumn","badge":"Mùa Thu","licensed":true},"female-winter-v1":{"file":"female-front-v1.png","label":"Người mẫu Nữ Mùa Đông","gender":"female","occasion":"winter","season":"winter","badge":"Mùa Đông","licensed":true},"female-work-v1":{"file":"female-front-v1.png","label":"Người mẫu Nữ Công Sở","gender":"female","occasion":"work","season":"all","badge":"Công sở","licensed":true},"female-street-v1":{"file":"female-front-v1.png","label":"Người mẫu Nữ Dạo Phố","gender":"female","occasion":"street","season":"all","badge":"Dạo phố","licensed":true},"female-party-v1":{"file":"female-front-v1.png","label":"Người mẫu Nữ Dạ Tiệc","gender":"female","occasion":"party","season":"all","badge":"Dạ tiệc","licensed":true}}
      - VERCEL=0
      - AI_VTO_PRODUCTS={"1a5c27ed-b257-4501-87a0-8341847dc2c4":{"category":"upper_body","photo_type":"flat-lay","verified":true,"variant_images":{"05750c62-e89a-466d-9923-c43a10803b40":"https://cdn.jsdelivr.net/gh/khai0335814880-create/Velura-Images@main/categories/ao/ao_ao-peplum-co-vuong-sage-diu-nhe_sage_01.jpg","205b03c4-9eaa-467d-8bfb-d596faf21aae":"https://cdn.jsdelivr.net/gh/khai0335814880-create/Velura-Images@main/categories/ao/ao_ao-peplum-co-vuong-sage-diu-nhe_sage_01.jpg","62304aaf-f079-4f7f-9d20-297145213ea1":"https://cdn.jsdelivr.net/gh/khai0335814880-create/Velura-Images@main/categories/ao/ao_ao-peplum-co-vuong-sage-diu-nhe_sage_01.jpg","d03c76ed-5ff0-43fb-b0b9-29f4eaa4bbc8":"https://cdn.jsdelivr.net/gh/khai0335814880-create/Velura-Images@main/categories/ao/ao_ao-peplum-co-vuong-sage-diu-nhe_sage_01.jpg","ee6b5c0d-dbeb-426b-9124-b57fbd956a43":"https://cdn.jsdelivr.net/gh/khai0335814880-create/Velura-Images@main/categories/ao/ao_ao-peplum-co-vuong-sage-diu-nhe_sage_01.jpg","eecc22f1-4353-485c-a860-e8069dab71c3":"https://cdn.jsdelivr.net/gh/khai0335814880-create/Velura-Images@main/categories/ao/ao_ao-peplum-co-vuong-sage-diu-nhe_sage_01.jpg"}}}
