apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1@sha256:d62e2d81c6f5048f652f67c302083be1272c181b971fad80e5a30ebe2b8b75d8
        ports:
        - name: http
          containerPort: 4180
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 150m
            memory: 96Mi
        readinessProbe:
          httpGet:
            path: /ping
            port: 4180
        livenessProbe:
          httpGet:
            path: /ping
            port: 4180
        args:
        - --provider=keycloak-oidc
        - --client-id=storage-admin
        - --oidc-issuer-url=https://auth.royalai.dev/realms/velura
        - --http-address=0.0.0.0:4180
        - --upstream=http://s3-service.storage.svc:8888
        - --redirect-url=https://s3.royalai.dev/oauth2/callback
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --email-domain=*
        - --allowed-role=storage_admin
        - --pass-basic-auth=false
        - --pass-access-token=false
        - --reverse-proxy=true
        env:
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-credentials
              key: client-secret
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-credentials
              key: cookie-secret
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: networking
spec:
  type: ClusterIP
  selector:
    app: oauth2-proxy
  ports:
  - name: http
    port: 4180
    targetPort: 4180
