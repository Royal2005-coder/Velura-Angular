apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-ingress-contract
  namespace: networking
data:
  ingress.yaml: |
    ingress:
      - hostname: auth.royalai.dev
        path: ^/(admin|realms/master)(/.*)?$
        service: http_status:403
      - hostname: auth.royalai.dev
        service: http://keycloak.auth.svc:8080
      - hostname: api.royalai.dev
        path: ^/(metrics|api/metrics)(/.*)?$
        service: http_status:403
      - hostname: api.royalai.dev
        service: http://velura-api.velura.svc:3000
      - hostname: velura.royalai.dev
        path: ^/(metrics|api/metrics)(/.*)?$
        service: http_status:403
      - hostname: velura.royalai.dev
        path: ^/api(/.*)?$
        service: http://velura-api.velura.svc:3000
      - hostname: velura.royalai.dev
        service: http://velura-storefront.velura.svc:80
      - hostname: shop.royalai.dev
        path: ^/(metrics|api/metrics)(/.*)?$
        service: http_status:403
      - hostname: shop.royalai.dev
        path: ^/api(/.*)?$
        service: http://velura-api.velura.svc:3000
      - hostname: shop.royalai.dev
        service: http://velura-storefront.velura.svc:80
      - hostname: admin.royalai.dev
        path: ^/(metrics|api/metrics)(/.*)?$
        service: http_status:403
      - hostname: admin.royalai.dev
        path: ^/api(/.*)?$
        service: http://velura-api.velura.svc:3000
      - hostname: admin.royalai.dev
        service: http://velura-admin.velura.svc:80
      - hostname: staging.royalai.dev
        path: ^/(metrics|api/metrics)(/.*)?$
        service: http_status:403
      - hostname: staging.royalai.dev
        path: ^/api(/.*)?$
        service: http://velura-api.velura-staging.svc:3000
        originRequest:
          access: &staging-access
            required: true
            teamName: ${CLOUDFLARE_ACCESS_TEAM}
            audTag: ["${CLOUDFLARE_ACCESS_STAGING_AUD}"]
      - hostname: staging.royalai.dev
        service: http://velura-storefront.velura-staging.svc:80
        originRequest:
          access: *staging-access
      - hostname: staging-admin.royalai.dev
        path: ^/(metrics|api/metrics)(/.*)?$
        service: http_status:403
      - hostname: staging-admin.royalai.dev
        path: ^/api(/.*)?$
        service: http://velura-api.velura-staging.svc:3000
        originRequest:
          access: *staging-access
      - hostname: staging-admin.royalai.dev
        service: http://velura-admin.velura-staging.svc:80
        originRequest:
          access: *staging-access
      - hostname: iam-admin.royalai.dev
        service: http://keycloak.auth.svc:8080
        originRequest:
          access: &admin-access
            required: true
            teamName: ${CLOUDFLARE_ACCESS_TEAM}
            audTag: ["${CLOUDFLARE_ACCESS_ADMIN_AUD}"]
      - hostname: grafana.royalai.dev
        service: http://grafana.observability.svc:3000
        originRequest:
          access: *admin-access
      - hostname: s3.royalai.dev
        service: http://oauth2-proxy.networking.svc:4180
        originRequest:
          access: *admin-access
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
        ports:
        - name: http
          containerPort: 2000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: cloudflare-tunnel-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: creds
        secret:
          secretName: cloudflare-tunnel-credentials
          items:
          - key: credentials.json
            path: credentials.json
