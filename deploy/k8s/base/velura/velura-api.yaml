apiVersion: v1
kind: ConfigMap
metadata:
  name: velura-api-config
  namespace: velura
data:
  NODE_ENV: "production"
  PORT: "3000"
  CORS_ORIGIN: "http://100.77.166.27:30080,http://100.77.166.27:30081,http://localhost:4001,http://localhost:4002,https://velura.royalai.dev,https://admin.royalai.dev,https://shop.royalai.dev,https://api.royalai.dev,https://velura.vn,https://admin.velura.vn"
  STOREFRONT_ORIGIN: "https://velura.royalai.dev"
  DATABASE_URL: "postgres://postgres:placeholder-password@postgres.database.svc:5432/velura_db"
  S3_ENDPOINT: "http://s3-storage.storage.svc:9000"
  LITELLM_ENDPOINT: "http://litellm.observability.svc:4000"
  AI_CLIP_ENDPOINT: "http://ai-clip.ai.svc:8000"
  AI_CLUSTER_ENDPOINT: "http://ai-clip.ai.svc:8000"
  AI_ENGINE_MODE: "cluster"
  AI_ENABLE: "true"
  AI_VERIFIED_TASKS: "image_quality,image_embedding,virtual_try_on,product_image_enhance"
  AI_PRIVATE_ROOT: "/app/scratch/ai-private"
  LOKI_ENDPOINT: "http://loki.observability.svc:3100"
  KEYCLOAK_URL: "http://keycloak.auth.svc:8080"
  VERCEL: "0"
  GEMINI_MODEL: "gemini-1.5-flash"
  N8N_CHAT_WEBHOOK_URL: "https://gianth.app.n8n.cloud/webhook/ai-ecommerce-customer-support"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velura-api
  namespace: velura
  labels:
    app.kubernetes.io/name: velura-api
    app.kubernetes.io/part-of: velura-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velura-api
  template:
    metadata:
      labels:
        app: velura-api
    spec:
      containers:
      - name: velura-api
        image: ghcr.io/boygia757-netizen/velura-api:latest
        imagePullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 3000
        envFrom:
          - configMapRef:
              name: velura-api-config
          - secretRef:
              name: velura-api-secrets
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 600m
            memory: 384Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
          - name: ai-private-data
            mountPath: /app/scratch/ai-private
      volumes:
        - name: ai-private-data
          hostPath:
            path: /var/velura/ai-private
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: velura-api
  namespace: velura
  labels:
    app.kubernetes.io/name: velura-api
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
      name: http
  selector:
    app: velura-api
