apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/velura
- ../../secrets/production
patches:
  - path: release-revision.yaml
  # Append last so duplicate keys win over velura-api-secrets during the Supabase cutover.
  - target:
      kind: Deployment
      name: velura-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: velura-api-supabase
images:
- name: ghcr.io/royal2005-coder/velura-api
  newName: ghcr.io/royal2005-coder/velura-api
  digest: sha256:f2febb067fe14128580e127dac91da3f7c8d97bac6eeebe74c33ab60e63da554
- name: ghcr.io/royal2005-coder/velura-storefront
  newName: ghcr.io/royal2005-coder/velura-storefront
  digest: sha256:cfa36306644e06eb00d8f935290b99930bf783896d587c24f9038763f15adb70
