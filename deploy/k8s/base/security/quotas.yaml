apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-budget
  namespace: auth
spec:
  hard:
    # Admit the serving pod plus its RollingUpdate replacement. Keycloak builds its
    # optimized server image on every config change and needs ~2Gi, so the floor
    # must cover one serving pod plus the surge pod.
    requests.memory: 1Gi
    limits.memory: 4Gi
    requests.cpu: '3'
    limits.cpu: '6'
    pods: '4'
    requests.storage: 100Gi
    persistentvolumeclaims: '8'
    services.nodeports: '0'
    services.loadbalancers: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: auth
spec:
  limits:
  - type: Container
    default:
      cpu: 300m
      memory: 256Mi
    defaultRequest:
      cpu: 25m
      memory: 64Mi
