apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: velura-staging
resources:
  - namespace.yaml
  - ../../base/velura
patches:
  - path: release-revision.yaml
  - target:
      kind: Deployment
      name: velura-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: velura-api
      spec:
        template:
          spec:
            priorityClassName: velura-staging
            containers:
              - name: velura-api
                resources:
                  requests: {cpu: 25m, memory: 128Mi}
                  limits: {cpu: 500m, memory: 256Mi}
  - target:
      kind: Deployment
      name: velura-admin
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: velura-admin
      spec:
        # No surge capacity: staging admin is unavailable until its replacement is Ready.
        strategy:
          type: Recreate
          rollingUpdate: null
        template:
          spec:
            priorityClassName: velura-staging
            containers:
              - name: velura-admin
                resources:
                  requests: {cpu: 25m, memory: 32Mi}
                  limits: {cpu: 250m, memory: 96Mi}
  - target:
      kind: Deployment
      name: velura-storefront
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: velura-storefront
      spec:
        # No surge capacity: staging storefront is unavailable until its replacement is Ready.
        strategy:
          type: Recreate
          rollingUpdate: null
        template:
          spec:
            priorityClassName: velura-staging
            containers:
              - name: velura-storefront
                resources:
                  requests: {cpu: 25m, memory: 32Mi}
                  limits: {cpu: 250m, memory: 96Mi}
  - target:
      kind: ConfigMap
      name: velura-api-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: velura-api-config
      data:
        CORS_ORIGIN: https://staging.royalai.dev,https://staging-admin.royalai.dev
        STOREFRONT_ORIGIN: https://staging.royalai.dev
        AI_ENABLE: 'false'
        AI_CLUSTER_ENDPOINT: http://ai-worker.ai-staging.svc:8000
images:
  - name: ghcr.io/royal2005-coder/velura-api
    newName: ghcr.io/royal2005-coder/velura-api
    digest: sha256:02fb777124f7457ea5e13306aa8a40ceda78a334492f45f350697d4adf8c91fe
  - name: ghcr.io/royal2005-coder/velura-admin
    newName: ghcr.io/royal2005-coder/velura-admin
    digest: sha256:7ed8ae854e394939dc4e9c3e4e3e4c2a6ba6fd361cd6a680f0c2cd361a6699dc
  - name: ghcr.io/royal2005-coder/velura-storefront
    newName: ghcr.io/royal2005-coder/velura-storefront
    digest: sha256:360e177388aa42e0a8ff2c1a561e08b6d89d84ada9f83ec46407072dc11e0419
