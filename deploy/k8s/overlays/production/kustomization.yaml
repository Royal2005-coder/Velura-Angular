apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/velura
- ../../secrets/production
patches:
  - path: release-revision.yaml
  # Append last so duplicate keys win over velura-api-secrets during the Supabase cutover.
  - target:
      kind: Deployment
      name: velura-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: velura-api-supabase
images:
- name: ghcr.io/royal2005-coder/velura-api
  newName: ghcr.io/royal2005-coder/velura-api
  digest: sha256:7e66c2c284b438b4d7e5a3876827a017e718ced28a10e6892666281c37559a46
- name: ghcr.io/royal2005-coder/velura-storefront
  newName: ghcr.io/royal2005-coder/velura-storefront
  digest: sha256:82acad741371fe5f845c84330f2ea23d33e53ac0a03cbe1446c1af8be5b09047
- name: ghcr.io/royal2005-coder/velura-admin
