apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/velura
- ../../secrets/production
patches:
  - path: release-revision.yaml
  # Append last so duplicate keys win over velura-api-secrets during the Supabase cutover.
  - target:
      kind: Deployment
      name: velura-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: velura-api-supabase
images:
- name: ghcr.io/royal2005-coder/velura-api
  newName: ghcr.io/royal2005-coder/velura-api
  digest: sha256:ef5f92b2580b1921f403cf28d67dba74642992b509081879ec15975a293c6a78
- name: ghcr.io/royal2005-coder/velura-storefront
