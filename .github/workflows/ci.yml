# Feature → PR into develop: validate + test + build (+ PR trace). No deploy.
# Push develop: validate + test + build (integration only).
# develop → PR into main: same gate. Push main: deploy + verify production.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  npm_config_fund: false
  npm_config_cache: ${{ github.workspace }}/.npm

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Workspace contract
        run: |
          test -f apps/admin-ng/package.json
          test -f apps/user-ng/package.json
          test -f apps/api/src/server.ts
          test -f apps/api/tsconfig.json
          test -f .env.example
      - name: Forbid skip ci
        run: |
          if echo "${{ github.event.head_commit.message }}${{ github.event.pull_request.title }}" | grep -qiE '\[skip ci\]|\[ci skip\]'; then
            echo "[skip ci] is forbidden. Pipeline must always run."
            exit 1
          fi
      - name: No private keys in repo
        run: |
          if grep -R --exclude-dir=.git --exclude-dir=node_modules --include='*.pem' --include='*.key' -n "BEGIN .*PRIVATE KEY" . ; then
            echo "Private keys must not be in the repository"
            exit 1
          fi
      - name: No @ts-nocheck in API
        run: |
          if grep -R --include='*.ts' -n '@ts-nocheck' apps/api ; then
            echo "apps/api must not use @ts-nocheck. Type the file or narrow unknown."
            exit 1
          fi

  validate-pr-contract:
    name: validate-pr-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title / branch contract
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          SRC: ${{ github.head_ref }}
          TGT: ${{ github.base_ref }}
        run: |
          set -e
          echo "PR title=[$TITLE]"
          echo "PR source=[$SRC] target=[$TGT]"
          if [ "$SRC" = "develop" ] && [ "$TGT" = "main" ]; then
            echo "Promote contract OK: develop → main."
            exit 0
          fi
          if [ "$TGT" = "main" ]; then
            echo "Production is only promoted from develop. Close this PR."
            echo "New PR: source=develop target=main."
            exit 1
          fi
          echo "$TITLE" | grep -Eqi '^(Draft:[[:space:]]*)?KAN-[0-9]+' || {
            echo "Feature PR title must start with KAN-n (optional Draft: prefix)."
            exit 1
          }
          printf '%s\n' "$BODY" | grep -qiE '^##[[:space:]]*(Why|Tại sao)' || {
            echo "PR description must include a heading line ## Why"
            exit 1
          }
          case "$SRC" in
            feature/*|hotfix/*|develop) ;;
            *)
              echo "Source branch must be feature/KAN-*, hotfix/KAN-*, or develop"
              exit 1
              ;;
          esac

  test-api:
    name: test-api
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck:api
      - run: npm run test:api

  test-angular:
    name: test-angular
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:ng

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:api
      - run: npm run build:user
      - run: npm run build:admin
      - run: |
          test -f apps/api/dist/server.js
          test -d apps/user-ng/dist/user-ng/browser
          test -d apps/admin-ng/dist/admin-ng/browser
      - uses: actions/upload-artifact@v4
        with:
          name: velura-dist
          retention-days: 14
          path: |
            apps/user-ng/dist
            apps/admin-ng/dist
            apps/api/dist
            apps/api/package.json
            deploy

  migrations:
    name: Kiểm tra migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Migration được đánh số tuần tự và không sửa lại bản đã chạy. Hai nhánh cùng
      # thêm một số thứ tự là lỗi hay gặp nhất khi merge, và nếu không chặn ở đây thì
      # chỉ lộ ra lúc chạy thật trên production.
      #
      # Chỉ chặn từ 025 trở đi: kho hiện đã có sẵn trùng số ở 005 (005/005b/005c) và
      # 015 (ba file). Đó là nợ cũ, dọn riêng — không để nó làm đỏ mọi lần chạy.
      - name: Chặn trùng số thứ tự migration mới
        run: |
          set -euo pipefail
          duplicates=$(ls database/migrations \
            | grep -oE '^[0-9]+' \
            | awk '$1 + 0 >= 25' \
            | sort \
            | uniq -d || true)
          if [ -n "$duplicates" ]; then
            echo "::error::Trùng số thứ tự migration: $duplicates"
            for n in $duplicates; do ls database/migrations | grep -E "^${n}"; done
            exit 1
          fi
          echo "Không có migration mới nào trùng số."

      - name: Liệt kê nợ trùng số cũ (chỉ cảnh báo)
        run: |
          legacy=$(ls database/migrations \
            | grep -oE '^[0-9]+' \
            | awk '$1 + 0 < 25' \
            | sort \
            | uniq -d || true)
          if [ -n "$legacy" ]; then
            echo "::warning::Migration cũ đang trùng số: $legacy — cần đánh số lại khi có dịp."
          fi

  note-pr:
    name: note-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [validate, validate-pr-contract, test-api, test-angular, build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write PR trace
        env:
          TITLE: ${{ github.event.pull_request.title }}
          SRC: ${{ github.head_ref }}
          TGT: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          LOG=$(git log --oneline "${BASE}..HEAD" | head -n 30)
          STAT=$(git diff --stat "${BASE}...HEAD" | tail -n 40)
          {
            echo "## Trace log (required CI note)"
            echo
            echo "- Title: \`$TITLE\`"
            echo "- Source: \`$SRC\` → target: \`$TGT\`"
            echo "- SHA: \`${SHA:0:8}\` (\`$SHA\`)"
            echo "- Run: $RUN_URL"
            echo
            echo "### git log"
            echo '```'
            echo "$LOG"
            echo '```'
            echo
            echo "### diff --stat"
            echo '```'
            echo "$STAT"
            echo '```'
          } > pr-trace.md
          cat pr-trace.md
      - uses: actions/upload-artifact@v4
        with:
          name: pr-trace
          path: pr-trace.md
          retention-days: 30
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-trace.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Trace log (required CI note)';
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-production:
    name: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test-api, test-angular, build]
    environment:
      name: production
      url: https://velura.royalai.dev/
    concurrency:
      group: velura-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: velura-dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Prepare Vercel outputs
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_API: ${{ secrets.VERCEL_PROJECT_ID_API }}
          VERCEL_PROJECT_ID_USER: ${{ secrets.VERCEL_PROJECT_ID_USER }}
          VERCEL_PROJECT_ID_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
        run: node deploy/scripts/prepare-vercel-spa.mjs
      - name: Deploy API to Vercel
        run: vercel deploy --prod --cwd apps/api --token ${{ secrets.VERCEL_TOKEN }} --yes
      - name: Deploy Storefront to Vercel
        run: vercel deploy --prebuilt --prod --cwd apps/user-ng --token ${{ secrets.VERCEL_TOKEN }} --yes
      - name: Deploy Admin to Vercel
        run: vercel deploy --prebuilt --prod --cwd apps/admin-ng --token ${{ secrets.VERCEL_TOKEN }} --yes

  verify-production:
    name: verify-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [deploy-production]
    environment:
      name: production
      url: https://velura.royalai.dev/
    steps:
      - name: Health checks
        run: |
          set -e
          echo "Verifying Vercel direct deployments..."
          curl -fsS https://velura-api.vercel.app/health | grep '"ok":true'
          test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-redirs 2 https://velura-storefront.vercel.app/)" = "200"
          test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-redirs 2 https://velura-admin-mocha.vercel.app/)" = "200"

          echo "Checking custom domain routing..."
          if curl -fsS -m 5 https://velura.royalai.dev/api/health 2>/dev/null | grep -q '"ok":true'; then
            echo "Custom domain velura.royalai.dev is live and healthy."
          else
            echo "::warning::Custom domain velura.royalai.dev is waiting for Cloudflare CNAME update to cname.vercel-dns.com."
          fi
