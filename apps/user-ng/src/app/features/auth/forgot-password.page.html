<main class="velura-auth-page" aria-label="Khôi phục mật khẩu Velura">
  <div class="login-page">
    <a class="logo-container" routerLink="/" aria-label="Về trang chủ Velura">
      <img src="/assets/images/auth/logo_velura.png" alt="Velura" class="logo" />
    </a>
    <img src="/assets/images/auth/model_main.png" alt="" class="main-model" aria-hidden="true" />

    <form class="login-container" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <nav class="back-link" aria-label="Điều hướng xác thực">
        <a routerLink="/auth/signin">
          <span aria-hidden="true">←</span>
          Quay lại đăng nhập
        </a>
      </nav>

      <header class="header">
        <h1>Quên mật khẩu?</h1>
        <p>Nhập email hoặc số điện thoại để nhận mã xác nhận</p>
      </header>

      <div class="form-group">
        <label for="identity">Email hoặc số điện thoại</label>
        <div class="input-wrapper">
          <input id="identity" type="text" formControlName="identity" placeholder="example@velura.com hoặc 0912 345 678" autocomplete="username" />
        </div>
        <p class="input-hint">Nhập thông tin đã dùng để đăng ký tài khoản</p>
        @if (errorMessage()) {
          <div class="field__error" aria-live="polite">{{ errorMessage() }}</div>
        }
        @if (successMessage()) {
          <p class="input-hint">{{ successMessage() }}</p>
        }
      </div>

      <button type="submit" class="btn-login" [disabled]="submitting()">Gửi mã xác nhận</button>
    </form>
  </div>
</main>
<app-auth-otp-modal
  [open]="otpOpen()"
  [identity]="otpIdentity()"
  purpose="reset-password"
  (verified)="onOtpVerified($event)"
  (cancelled)="onOtpCancelled()"
/>
