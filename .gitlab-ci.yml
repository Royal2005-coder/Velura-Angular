# Feature → MR into develop: tests + required MR trace note. No deploy.
# Push develop: tests + build only (integration branch).
# develop → MR into main: tests + note. main: deploy + verify production.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - test
  - build
  - note
  - deploy
  - verify

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  npm_config_fund: false
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: 50

.rules_test_build:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.ssh_deploy:
  image: alpine:3.20
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client rsync
    - |
      missing=""
      [ -n "${SSH_PRIVATE_KEY:-}" ] || missing="$missing SSH_PRIVATE_KEY"
      [ -n "${SSH_KNOWN_HOSTS:-}" ] || missing="$missing SSH_KNOWN_HOSTS"
      [ -n "${DEPLOY_HOST:-}" ] || missing="$missing DEPLOY_HOST"
      [ -n "${DEPLOY_USER:-}" ] || missing="$missing DEPLOY_USER"
      if [ -n "$missing" ]; then
        echo "Deploy CI variables empty:$missing"
        echo "Protected variables are injected only on protected branches."
        echo "Either unprotect SSH_PRIVATE_KEY (and the other deploy vars) or protect both develop and main."
        echo "GitLab → Settings → CI/CD → Variables. See docs/HOW-IT-WORKS.md"
        exit 1
      fi
    - mkdir -p ~/.ssh
    - |
      echo "CI_COMMIT_REF_PROTECTED=${CI_COMMIT_REF_PROTECTED:-unset} branch=${CI_COMMIT_BRANCH:-} env=${CI_ENVIRONMENT_NAME:-none}"
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        echo "SSH_PRIVATE_KEY is a File variable; copying that file"
        tr -d '\r' < "$SSH_PRIVATE_KEY" > ~/.ssh/deploy.key
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy.key
      fi
      chmod 600 ~/.ssh/deploy.key
      echo "deploy.key bytes=$(wc -c < ~/.ssh/deploy.key)"
      grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy.key || {
        echo "SSH_PRIVATE_KEY is not a PEM. Check type=Variable (not a random string) and Environment scope=All (not only production)."
        exit 1
      }
    - printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - export SSH="ssh -i ~/.ssh/deploy.key -o IdentitiesOnly=yes"

validate:workspace:
  stage: validate
  extends: .rules_test_build
  script:
    - test -f apps/admin-ng/package.json
    - test -f apps/user-ng/package.json
    - test -f apps/api/src/server.ts
    - test -f apps/api/tsconfig.json
    - test -f .env.example
    - |
      if echo "$CI_COMMIT_MESSAGE" | grep -qiE '\[skip ci\]|\[ci skip\]'; then
        echo "[skip ci] is forbidden. Pipeline must always run."
        exit 1
      fi
    - |
      if grep -R --exclude-dir=.git --exclude-dir=node_modules --include='*.pem' --include='*.key' -n "BEGIN .*PRIVATE KEY" . ; then
        echo "Private keys must not be in the repository"
        exit 1
      fi
    - |
      if grep -R --include='*.ts' -n '@ts-nocheck' apps/api ; then
        echo "apps/api must not use @ts-nocheck. Type the file or narrow unknown."
        exit 1
      fi

validate:mr-contract:
  stage: validate
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      TITLE=$(printf '%s' "${CI_MERGE_REQUEST_TITLE:-}" | tr -d '\r')
      DESC=$(printf '%s' "${CI_MERGE_REQUEST_DESCRIPTION:-}" | tr -d '\r')
      SRC="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME:-}"
      TGT="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}"
      echo "MR title=[$TITLE]"
      echo "MR source=[$SRC] target=[$TGT]"
      if [ "$SRC" = "develop" ] && [ "$TGT" = "main" ]; then
        echo "Promote contract OK: develop → main. Why already lives in git log of merged feature MRs."
        exit 0
      fi
      if [ "$TGT" = "main" ]; then
        echo "Production is only promoted from develop. Close this MR."
        echo "New MR: source=develop target=main. Do not target main from a feature branch."
        exit 1
      fi
      echo "$TITLE" | grep -Eqi '^(Draft:[[:space:]]*)?KAN-[0-9]+' || {
        echo "Feature MR title must start with KAN-n (optional Draft: prefix)."
        echo "GitLab set title=[$TITLE]."
        echo "If this was meant to be production: source must be develop, target must be main — then retry."
        echo "If this is a feature MR: edit the title on GitLab to start with KAN-n. Do not add SSH keys."
        exit 1
      }
      printf '%s\n' "$DESC" | grep -qiE '^##[[:space:]]*(Why|Tại sao)' || {
        echo "MR description must include a heading line ## Why (Context as Code)."
        echo "Paste .gitlab/merge_request_templates/Default.md into the MR. Do not add docs/KAN-n.md."
        exit 1
      }
      case "$SRC" in
        feature/*|hotfix/*|develop) ;;
        *)
          echo "Source branch must be feature/KAN-*, hotfix/KAN-*, or develop"
          exit 1
          ;;
      esac

test:api:
  stage: test
  extends: .rules_test_build
  script:
    - npm ci
    - npm run typecheck:api
    - npm run test:api

test:angular:
  stage: test
  extends: .rules_test_build
  timeout: 20m
  script:
    - npm ci
    - npm run test:ng

build:angular:
  stage: build
  extends: .rules_test_build
  script:
    - npm ci
    - npm run build:api
    - npm run build:user
    - npm run build:admin
    - test -f apps/api/dist/server.js
    - test -d apps/user-ng/dist/user-ng/browser
    - test -d apps/admin-ng/dist/admin-ng/browser
  artifacts:
    expire_in: 14 days
    paths:
      - apps/user-ng/dist
      - apps/admin-ng/dist
      - apps/api/dist
      - apps/api/package.json
      - deploy

note:mr:
  stage: note
  image: alpine:3.20
  allow_failure: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - job: validate:workspace
    - job: validate:mr-contract
    - job: test:api
    - job: test:angular
    - job: build:angular
  script:
    - sed -i 's/\r$//' deploy/scripts/post-mr-trace.sh
    - sh deploy/scripts/post-mr-trace.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - mr-trace.md

deploy:production:
  stage: deploy
  extends: .ssh_deploy
  resource_group: velura-production
  environment:
    name: production
    url: https://velura.royalai.dev/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  needs:
    - job: test:api
    - job: test:angular
    - job: build:angular
  script:
    - SSH="ssh -i ~/.ssh/deploy.key -o IdentitiesOnly=yes"
    - test -f apps/api/dist/server.js || { echo "build:api did not emit apps/api/dist/server.js"; exit 1; }
    - rsync -az --delete -e "$SSH" apps/user-ng/dist/user-ng/browser/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/velura/user/"
    - rsync -az --delete -e "$SSH" apps/admin-ng/dist/admin-ng/browser/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/velura/admin/"
    - rsync -az --delete --exclude node_modules -e "$SSH" apps/api/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/velura/api/"
    - rsync -az -e "$SSH" deploy/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/velura/deploy/"
    - $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /opt/velura/api && npm install --omit=dev && sudo sed -i 's/\r$//' /opt/velura/deploy/nginx/velura.conf /opt/velura/deploy/systemd/velura-api.service && sudo cp /opt/velura/deploy/nginx/velura.conf /etc/nginx/sites-available/velura && sudo nginx -t && sudo systemctl restart velura-api && sudo systemctl reload nginx"

verify:production:
  stage: verify
  image: alpine:3.20
  environment:
    name: production
    url: https://velura.royalai.dev/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  needs:
    - job: deploy:production
  script:
    - apk add --no-cache curl
    - test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-redirs 2 https://velura.royalai.dev/)" = "200"
    - curl -fsS https://velura.royalai.dev/api/health | grep '"ok":true'
    - test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-redirs 2 https://velura.royalai.dev/api/health)" = "200"
    - test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-redirs 2 https://admin.royalai.dev/login)" = "200"
    - curl -fsS https://admin.royalai.dev/ | grep -q "Velura Admin"
