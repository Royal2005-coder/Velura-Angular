apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velura-alloy-logs
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velura-alloy-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velura-alloy-logs
subjects:
- kind: ServiceAccount
  name: alloy
  namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: observability
data:
  config.alloy: "discovery.kubernetes \"pods\" {\n  role = \"pod\"\n}\ndiscovery.relabel\
    \ \"pods\" {\n  targets = discovery.kubernetes.pods.targets\n  rule {\n    source_labels\
    \ = [\"__meta_kubernetes_namespace\"]\n    target_label = \"namespace\"\n  }\n\
    \  rule {\n    source_labels = [\"__meta_kubernetes_pod_name\"]\n    target_label\
    \ = \"pod\"\n  }\n  rule {\n    source_labels = [\"__meta_kubernetes_pod_container_name\"\
    ]\n    target_label = \"container\"\n  }\n}\nloki.source.kubernetes \"pods\" {\n\
    \  targets = discovery.relabel.pods.output\n  forward_to = [loki.write.local.receiver]\n\
    }\nloki.write \"local\" {\n  endpoint {\n    url = \"http://loki:3100/loki/api/v1/push\"\
    \n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      automountServiceAccountToken: true
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: alloy
        image: grafana/alloy:v1.10.2
        ports:
        - name: http
          containerPort: 12345
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          tcpSocket:
            port: 12345
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 12345
          initialDelaySeconds: 30
          periodSeconds: 20
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy
        - --server.http.listen-addr=0.0.0.0:12345
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
          readOnly: true
        - name: data
          mountPath: /var/lib/alloy
      serviceAccountName: alloy
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: data
        emptyDir: {}
