apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics
subjects:
- kind: ServiceAccount
  name: victoriametrics
  namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape-config
  namespace: observability
data:
  scrape.yaml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - job_name: velura-http
        bearer_token_file: /etc/velura-metrics-key/metrics-token
        static_configs:
          - targets: [velura-api.velura.svc:3000]
      - job_name: litellm
        bearer_token_file: /etc/metrics-key/master-key
        static_configs:
          - targets: [litellm:4000]
      - job_name: keycloak
        static_configs:
          - targets: [keycloak.auth.svc:9000]
      - job_name: victoriametrics
        static_configs:
          - targets: [localhost:8428]
      - job_name: vmalert
        static_configs:
          - targets: [vmalert:8880]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics-data
  namespace: observability
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      automountServiceAccountToken: true
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: victoriametrics
        image: victoriametrics/victoria-metrics:v1.104.0@sha256:4a03f2881108571949f83764069f5ecc325de5cbbae676c2742f0a2e7523a682
        ports:
        - name: http
          containerPort: 8428
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 600m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 8428
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8428
          initialDelaySeconds: 30
          periodSeconds: 20
        args:
        - -storageDataPath=/vmetrics-data
        - -httpListenAddr=:8428
        - -promscrape.config=/etc/victoriametrics/scrape.yaml
        - -retentionPeriod=14d
        - -memory.allowedBytes=384Mi
        volumeMounts:
        - name: data
          mountPath: /vmetrics-data
        - name: config
          mountPath: /etc/victoriametrics
          readOnly: true
        - name: metrics-key
          mountPath: /etc/metrics-key
          readOnly: true
        - name: velura-metrics-key
          mountPath: /etc/velura-metrics-key
          readOnly: true
      serviceAccountName: victoriametrics
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: victoriametrics-data
      - name: config
        configMap:
          name: victoriametrics-scrape-config
      - name: metrics-key
        secret:
          secretName: litellm-credentials
          items:
          - key: master-key
            path: master-key
      - name: velura-metrics-key
        secret:
          secretName: velura-metrics-collector-credentials
          items:
          - key: metrics-token
            path: metrics-token
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: victoriametrics
  ports:
  - name: http
    port: 8428
    targetPort: 8428
