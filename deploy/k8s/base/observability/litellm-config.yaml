router_settings:
  routing_strategy: simple-shuffle
  num_retries: 4
  retry_after: 1
  allowed_fails: 2
  cooldown_time: 60
litellm_settings:
  callbacks: [prometheus]
  # LiteLLM 1.79 reads this setting here, not under general_settings.
  require_auth_for_metrics_endpoint: true
  telemetry: false
  request_timeout: 60
  num_retries: 4
  fallbacks:
    - commerce-text: [gemini-3-flash-preview, gemini-3.5-flash]
    - gemini-3.5-flash-lite: [gemini-3-flash-preview, gemini-3.5-flash]
    - ministral-8b-latest: [commerce-text, gemini-3-flash-preview]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
