apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics
subjects:
- kind: ServiceAccount
  name: victoriametrics
  namespace: observability
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics-data
  namespace: observability
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      automountServiceAccountToken: true
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: victoriametrics
        image: victoriametrics/victoria-metrics:v1.104.0@sha256:4a03f2881108571949f83764069f5ecc325de5cbbae676c2742f0a2e7523a682
        ports:
        - name: http
          containerPort: 8428
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 600m
            memory: 512Mi
        readinessProbe:
          tcpSocket:
            port: 8428
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8428
          initialDelaySeconds: 30
          periodSeconds: 20
        args:
        - -storageDataPath=/vmetrics-data
        - -httpListenAddr=:8428
        - -promscrape.config=/etc/victoriametrics/scrape.yaml
        - -retentionPeriod=14d
        - -memory.allowedBytes=402653184
        volumeMounts:
        - name: data
          mountPath: /vmetrics-data
        - name: config
          mountPath: /etc/victoriametrics
          readOnly: true
        - name: metrics-key
          mountPath: /etc/metrics-key
          readOnly: true
        - name: velura-metrics-key
          mountPath: /etc/velura-metrics-key
          readOnly: true
      serviceAccountName: victoriametrics
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: victoriametrics-data
      - name: config
        configMap:
          name: victoriametrics-scrape-config
      - name: metrics-key
        secret:
          secretName: litellm-credentials
          # Missing credentials fail only the protected scrape, not core monitoring.
          # VictoriaMetrics reads bearer_token_file at request time.
          optional: true
          items:
          - key: master-key
            path: master-key
      - name: velura-metrics-key
        secret:
          secretName: velura-metrics-collector-credentials
          optional: true
          items:
          - key: metrics-token
            path: metrics-token
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: victoriametrics
  ports:
  - name: http
    port: 8428
    targetPort: 8428
