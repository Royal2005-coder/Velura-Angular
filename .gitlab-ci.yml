# Feature → MR into develop: tests + required MR trace note. No production.
# develop: deploy + verify staging (same VM, Host staging.*).
# develop → MR into main: tests + note. main: deploy + verify production.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - test
  - build
  - note
  - deploy
  - verify

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  npm_config_fund: false
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: 50
  STAGING_USER_HOST: staging.velura.royalai.dev
  STAGING_ADMIN_HOST: staging-admin.royalai.dev

.rules_test_build:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.ssh_deploy:
  image: alpine:3.20
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy.key
    - chmod 600 ~/.ssh/deploy.key
    - printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - export SSH="ssh -i ~/.ssh/deploy.key -o IdentitiesOnly=yes"

validate:workspace:
  stage: validate
  extends: .rules_test_build
  script:
    - test -f apps/admin-ng/package.json
    - test -f apps/user-ng/package.json
    - test -f apps/api/src/server.ts
    - test -f apps/api/tsconfig.json
    - test -f .env.example
    - |
      if echo "$CI_COMMIT_MESSAGE" | grep -qiE '\[skip ci\]|\[ci skip\]'; then
        echo "[skip ci] is forbidden. Pipeline must always run."
        exit 1
      fi
    - |
      if grep -R --exclude-dir=.git --exclude-dir=node_modules --include='*.pem' --include='*.key' -n "BEGIN .*PRIVATE KEY" . ; then
        echo "Private keys must not be in the repository"
        exit 1
      fi

validate:mr-contract:
  stage: validate
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      TITLE=$(printf '%s' "${CI_MERGE_REQUEST_TITLE:-}" | tr -d '\r')
      DESC=$(printf '%s' "${CI_MERGE_REQUEST_DESCRIPTION:-}" | tr -d '\r')
      echo "MR title=[$TITLE]"
      echo "MR source=[$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME] target=[$CI_MERGE_REQUEST_TARGET_BRANCH_NAME]"
      echo "$TITLE" | grep -Eqi '^(Draft:[[:space:]]*)?KAN-[0-9]+' || {
        echo "MR title must start with KAN-n (optional Draft: prefix). Version key for git log / Jira."
        exit 1
      }
      printf '%s\n' "$DESC" | grep -qiE '^##[[:space:]]*(Why|Tại sao)' || {
        echo "MR description must include a heading line ## Why (Context as Code)."
        echo "Paste .gitlab/merge_request_templates/Default.md into the MR. Do not add docs/KAN-n.md."
        exit 1
      }
    - |
      if [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = "main" ] \
        && [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != "develop" ]; then
        echo "Production is only promoted from develop. Retarget this MR to develop (staging), then open develop → main."
        exit 1
      fi
    - |
      case "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" in
        feature/*|hotfix/*|develop) ;;
        *)
          echo "Source branch must be feature/KAN-*, hotfix/KAN-*, or develop"
          exit 1
          ;;
      esac

test:api:
  stage: test
  extends: .rules_test_build
  script:
    - npm ci
    - npm run typecheck:api
    - npm run test:api

test:angular:
  stage: test
  extends: .rules_test_build
  timeout: 20m
  script:
    - npm ci
    - npm run test:ng

build:angular:
  stage: build
  extends: .rules_test_build
  script:
    - npm ci
    - npm run build:api
    - npm run build:user
    - npm run build:admin
  artifacts:
    expire_in: 14 days
    paths:
      - apps/user-ng/dist
      - apps/admin-ng/dist
      - apps/api
      - deploy

note:mr:
  stage: note
  image: alpine:3.20
  allow_failure: false
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  needs:
    - job: validate:workspace
    - job: validate:mr-contract
    - job: test:api
    - job: test:angular
    - job: build:angular
  script:
    - sed -i 's/\r$//' deploy/scripts/post-mr-trace.sh
    - sh deploy/scripts/post-mr-trace.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - mr-trace.md

deploy:staging:
  stage: deploy
  extends: .ssh_deploy
  resource_group: velura-staging
  environment:
    name: staging
    url: https://staging.velura.royalai.dev/
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
  needs:
    - job: test:api
    - job: test:angular
    - job: build:angular
  script:
    - SSH="ssh -i ~/.ssh/deploy.key -o IdentitiesOnly=yes"
    - $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /var/www/velura-staging/user /var/www/velura-staging/admin /opt/velura-staging/api /opt/velura/deploy"
    - rsync -az --delete -e "$SSH" apps/user-ng/dist/user-ng/browser/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/velura-staging/user/"
    - rsync -az --delete -e "$SSH" apps/admin-ng/dist/admin-ng/browser/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/velura-staging/admin/"
    - rsync -az --delete --exclude node_modules -e "$SSH" apps/api/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/velura-staging/api/"
    - rsync -az -e "$SSH" deploy/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/velura/deploy/"
    - $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "sed -i 's/\\r$//' /opt/velura/deploy/scripts/remote-staging.sh && bash /opt/velura/deploy/scripts/remote-staging.sh ${DEPLOY_USER}"

verify:staging:
  stage: verify
  extends: .ssh_deploy
  environment:
    name: staging
    url: https://staging.velura.royalai.dev/
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
  needs:
    - job: deploy:staging
  script:
    - SSH="ssh -i ~/.ssh/deploy.key -o IdentitiesOnly=yes"
    - |
      $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "set -e
        code=\$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: ${STAGING_USER_HOST}' http://127.0.0.1/)
        test \"\$code\" = 200
        curl -fsS -H 'Host: ${STAGING_USER_HOST}' http://127.0.0.1/api/health | grep '\"ok\":true'
        code=\$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: ${STAGING_ADMIN_HOST}' http://127.0.0.1/login)
        test \"\$code\" = 200
        curl -fsS -H 'Host: ${STAGING_ADMIN_HOST}' http://127.0.0.1/ | grep -q 'Velura Admin'
      "

deploy:production:
  stage: deploy
  extends: .ssh_deploy
  resource_group: velura-production
  environment:
    name: production
    url: https://velura.royalai.dev/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  needs:
    - job: test:api
    - job: test:angular
    - job: build:angular
  script:
    - SSH="ssh -i ~/.ssh/deploy.key -o IdentitiesOnly=yes"
    - rsync -az --delete -e "$SSH" apps/user-ng/dist/user-ng/browser/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/velura/user/"
    - rsync -az --delete -e "$SSH" apps/admin-ng/dist/admin-ng/browser/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/velura/admin/"
    - rsync -az --delete --exclude node_modules -e "$SSH" apps/api/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/velura/api/"
    - rsync -az -e "$SSH" deploy/ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/velura/deploy/"
    - $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /opt/velura/api && npm install --omit=dev && sudo sed -i 's/\r$//' /opt/velura/deploy/nginx/velura.conf /opt/velura/deploy/systemd/velura-api.service && sudo cp /opt/velura/deploy/nginx/velura.conf /etc/nginx/sites-available/velura && sudo nginx -t && sudo systemctl restart velura-api && sudo systemctl reload nginx"

verify:production:
  stage: verify
  image: alpine:3.20
  environment:
    name: production
    url: https://velura.royalai.dev/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
  needs:
    - job: deploy:production
  script:
    - apk add --no-cache curl
    - test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-redirs 2 https://velura.royalai.dev/)" = "200"
    - curl -fsS https://velura.royalai.dev/api/health | grep '"ok":true'
    - test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-redirs 2 https://velura.royalai.dev/api/health)" = "200"
    - test "$(curl -fsS -o /dev/null -w '%{http_code}' --max-redirs 2 https://admin.royalai.dev/login)" = "200"
    - curl -fsS https://admin.royalai.dev/ | grep -q "Velura Admin"
