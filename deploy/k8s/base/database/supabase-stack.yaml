apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: database
data:
  default.conf: |
    server {
        listen 8000;
        location /rest/v1/ {
            proxy_pass http://postgrest.database.svc:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /auth/v1/ {
            proxy_pass http://gotrue.database.svc:9999/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /storage/v1/ {
            proxy_pass http://storage-api.database.svc:5000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: supabase-secrets
  namespace: database
type: Opaque
stringData:
  jwt-secret: "super-secret-jwt-token-velura-production-32-chars-long-hs256"
  anon-key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTg3MjAwLCJleHAiOjE5MzkzNDcyMDB9.incluster-anon-key-signature"
  service-role-key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3ODE1ODcyMDAsImV4cCI6MTkzOTM0NzIwMH0.incluster-service-key-signature"
  authenticator-password: "authenticator_incluster_secret"
  # KAN-66: Google SSO. GoTrue only advertises a provider it has credentials for, so a project
  # without these returns {"error_code":"validation_failed","msg":"Unsupported provider: provider
  # is not enabled"} on /auth/v1/authorize. `google-enabled` stays "false" until real credentials
  # are supplied, so an unconfigured cluster still boots and the storefront keeps its email/OTP path.
  google-enabled: "false"
  google-client-id: ""
  google-client-secret: ""
---
# 1. postgres-meta: Schema introspection and SQL engine for Supabase Studio
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-meta
  namespace: database
  labels:
    app: postgres-meta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-meta
  template:
    metadata:
      labels:
        app: postgres-meta
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: postgres-meta
        image: supabase/postgres-meta:v0.84.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PG_META_PORT
          value: "8080"
        - name: PG_META_DB_HOST
          value: "postgres.database.svc"
        - name: PG_META_DB_PORT
          value: "5432"
        - name: PG_META_DB_NAME
          value: "velura"
        - name: PG_META_DB_USER
          value: "postgres"
        - name: PG_META_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        resources:
          requests:
            cpu: 30m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-meta
  namespace: database
spec:
  type: ClusterIP
  selector:
    app: postgres-meta
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# 2. postgrest: Auto-generated RESTful API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: database
  labels:
    app: postgrest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.0.2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PGRST_DB_URI
          value: "postgres://authenticator:authenticator_incluster_secret@postgres.database.svc:5432/velura"
        - name: PGRST_DB_SCHEMAS
          value: "public,storage"
        - name: PGRST_DB_ANON_ROLE
          value: "anon"
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: jwt-secret
        - name: PGRST_DB_USE_LEGACY_GUCS
          value: "false"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: database
spec:
  type: ClusterIP
  selector:
    app: postgrest
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
# 3. gotrue: Supabase Auth service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotrue
  namespace: database
  labels:
    app: gotrue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotrue
  template:
    metadata:
      labels:
        app: gotrue
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: gotrue
        image: supabase/gotrue:v2.158.1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 9999
          name: http
        env:
        - name: GOTRUE_DB_DRIVER
          value: "postgres"
        - name: GOTRUE_DB_DATABASE_URL
          value: "postgres://postgres:velura_secure_pg_2026@postgres.database.svc:5432/velura?sslmode=disable"
        - name: API_EXTERNAL_URL
          value: "https://supabase.royalai.dev/auth/v1"
        - name: GOTRUE_SITE_URL
          value: "https://velura.royalai.dev"
        - name: GOTRUE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: jwt-secret
        - name: GOTRUE_JWT_EXP
          value: "3600"
        - name: GOTRUE_JWT_ALGORITHM
          value: "HS256"
        - name: GOTRUE_DISABLE_SIGNUP
          value: "false"
        # KAN-66: without these GoTrue answers /auth/v1/authorize?provider=google with
        # "Unsupported provider: provider is not enabled" and the shopper sees raw JSON.
        - name: GOTRUE_EXTERNAL_GOOGLE_ENABLED
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: google-enabled
        - name: GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: google-client-id
        - name: GOTRUE_EXTERNAL_GOOGLE_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: google-client-secret
        - name: GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI
          value: "https://supabase.royalai.dev/auth/v1/callback"
        # GoTrue silently falls back to SITE_URL for a redirect_to it does not trust, which would
        # strand the PKCE verifier on the wrong origin. List both storefront and admin callbacks.
        - name: GOTRUE_URI_ALLOW_LIST
          value: "https://velura.royalai.dev/auth/callback,https://admin.royalai.dev/auth/callback,https://shop.royalai.dev/auth/callback"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 9999
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gotrue
  namespace: database
spec:
  type: ClusterIP
  selector:
    app: gotrue
  ports:
  - name: http
    port: 9999
    targetPort: 9999
---
# 4. storage-api: Supabase Storage engine backed by SeaweedFS S3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-api
  namespace: database
  labels:
    app: storage-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-api
  template:
    metadata:
      labels:
        app: storage-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: storage-api
        image: supabase/storage-api:v1.11.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: STORAGE_BACKEND
          value: "s3"
        - name: GLOBAL_S3_BUCKET
          value: "velura-storage"
        - name: GLOBAL_S3_ENDPOINT
          value: "http://s3-service.storage.svc:9000"
        - name: GLOBAL_S3_FORCE_PATH_STYLE
          value: "true"
        - name: GLOBAL_S3_PROTOCOL
          value: "http"
        - name: DATABASE_URL
          value: "postgres://postgres:velura_secure_pg_2026@postgres.database.svc:5432/velura?sslmode=disable"
        - name: PGRST_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: jwt-secret
        - name: ANON_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: anon-key
        - name: SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: supabase-secrets
              key: service-role-key
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 192Mi
        readinessProbe:
          httpGet:
            path: /status
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: storage-api
  namespace: database
spec:
  type: ClusterIP
  selector:
    app: storage-api
  ports:
  - name: http
    port: 5000
    targetPort: 5000
---
# 5. studio: Official Supabase Management Dashboard UI
