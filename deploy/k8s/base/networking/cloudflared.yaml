apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: networking
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: velura-infrastructure
data:
  config.yaml: |
    tunnel: 96cb38bf-7ca6-417a-aebb-075f365c5773
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # Direct API Gateway
      - hostname: api.royalai.dev
        service: http://velura-api.velura.svc.cluster.local:3000

      # Storefront API reverse-proxy fallback
      - hostname: velura.royalai.dev
        path: ^/api(/.*)?$
        service: http://velura-api.velura.svc.cluster.local:3000

      # Storefront SPA
      - hostname: velura.royalai.dev
        service: http://velura-storefront.velura.svc.cluster.local:80

      # Storefront alternative alias (shop.royalai.dev)
      - hostname: shop.royalai.dev
        path: ^/api(/.*)?$
        service: http://velura-api.velura.svc.cluster.local:3000
      - hostname: shop.royalai.dev
        service: http://velura-storefront.velura.svc.cluster.local:80

      # Admin API reverse-proxy fallback
      - hostname: admin.royalai.dev
        path: ^/api(/.*)?$
        service: http://velura-api.velura.svc.cluster.local:3000

      # Admin Portal SPA
      - hostname: admin.royalai.dev
        service: http://velura-admin.velura.svc.cluster.local:80

      # Central IAM / Keycloak SSO
      - hostname: auth.royalai.dev
        service: http://keycloak.auth.svc.cluster.local:8080

      # Observability / Grafana Dashboard
      - hostname: grafana.royalai.dev
        service: http://grafana.observability.svc.cluster.local:3000

      # AI Gateway / LiteLLM Proxy
      - hostname: ai.royalai.dev
        service: http://litellm.observability.svc.cluster.local:4000

      # Storage UI / SeaweedFS S3 protected by Keycloak SSO
      - hostname: s3.royalai.dev
        service: http://oauth2-proxy.networking.svc.cluster.local:4180

      # Catch-all
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: networking
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: velura-infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.10.0
        imagePullPolicy: IfNotPresent
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 15
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: cloudflared-config
      - name: creds
        secret:
          secretName: cloudflare-tunnel-credentials
