<main class="velura-auth-page" aria-label="Đăng nhập Velura">
  <div class="login-page">
    <a class="logo-container" routerLink="/" aria-label="Về trang chủ Velura">
      <img src="/assets/images/auth/logo_velura.png" alt="Velura" class="logo" />
    </a>

    <img src="/assets/images/auth/model_main.png" alt="" class="main-model" aria-hidden="true" />

    <form class="login-container" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <header class="header">
        <h1>Chào mừng bạn trở lại<br />với Velura</h1>
        <p>Đăng nhập để tiếp tục mua sắm</p>
      </header>

      <div class="tabs" role="tablist" aria-label="Phương thức đăng nhập">
        <button
          type="button"
          class="tab-btn tab"
          [class.tab--active]="method() === 'email'"
          role="tab"
          [attr.aria-selected]="method() === 'email'"
          (click)="setMethod('email')"
        >
          Email
        </button>
        <button
          type="button"
          class="tab-btn tab"
          [class.tab--active]="method() === 'phone'"
          role="tab"
          [attr.aria-selected]="method() === 'phone'"
          (click)="setMethod('phone')"
        >
          Số điện thoại
        </button>
      </div>

      <section class="tab-panel" [class.is-active]="method() === 'email'" role="tabpanel">
        <div class="form-group">
          <label for="email-login">Email</label>
          <div class="input-wrapper">
            <input id="email-login" type="email" formControlName="email" placeholder="example@velura.com" autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label for="password-email">Mật khẩu</label>
          <div class="input-wrapper">
            <input
              id="password-email"
              [type]="showEmailPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
            />
            <button class="toggle-password" type="button" aria-label="Hiển thị mật khẩu" (click)="togglePassword('email')">
              <span aria-hidden="true">◉</span>
            </button>
          </div>
        </div>
      </section>

      <section class="tab-panel" [class.is-active]="method() === 'phone'" role="tabpanel">
        <div class="form-group">
          <label for="phone">Số điện thoại</label>
          <div class="input-wrapper">
            <input id="phone" type="tel" formControlName="phone" placeholder="0912 345 678" autocomplete="tel" inputmode="numeric" />
          </div>
        </div>
        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <input
              id="password"
              [type]="showPhonePassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
            />
            <button class="toggle-password" type="button" aria-label="Hiển thị mật khẩu" (click)="togglePassword('phone')">
              <span aria-hidden="true">◉</span>
            </button>
          </div>
        </div>
      </section>

      @if (errorMessage()) {
        <div class="field__error" aria-live="polite">{{ errorMessage() }}</div>
      }

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" formControlName="remember" />
          <span>Ghi nhớ đăng nhập</span>
        </label>
        <a routerLink="/auth/forgot-password" class="forgot-password">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-login" [disabled]="submitting()">Đăng nhập</button>

      <div class="social-login">
        <button type="button" class="btn-social btn-google" aria-label="Đăng nhập bằng Google">
          <svg class="icon-google" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Google
        </button>
        <button type="button" class="btn-social btn-facebook" aria-label="Đăng nhập bằng Facebook">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg>
          Facebook
        </button>
      </div>

      <div class="or-divider">hoặc</div>

      <a class="btn-back" routerLink="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Tiếp tục mua sắm mà không cần đăng nhập
      </a>

      <p class="footer signup">Chưa có tài khoản? <a routerLink="/auth/signup">Đăng ký ngay</a></p>
    </form>
  </div>
</main>
<app-auth-otp-modal
  [open]="otpOpen()"
  [identity]="otpIdentity()"
  (verified)="onOtpVerified($event)"
  (cancelled)="onOtpCancelled()"
/>
