apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vmalert
        image: victoriametrics/vmalert:v1.104.0@sha256:a21e26fc334a4ba10bc69810c3b85000d852db5cd5e73269947c2732c272db36
        ports:
        - name: http
          containerPort: 8880
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8880
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8880
          initialDelaySeconds: 30
          periodSeconds: 20
        args:
        - -rule=/etc/vmalert/rules.yaml
        - -datasource.url=http://victoriametrics:8428
        - -remoteWrite.url=http://victoriametrics:8428
        - -remoteRead.url=http://victoriametrics:8428
        - -notifier.url=http://alertmanager:9093
        volumeMounts:
        - name: rules
          mountPath: /etc/vmalert
          readOnly: true
      volumes:
      - name: rules
        configMap:
          name: velura-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: vmalert
  ports:
  - name: http
    port: 8880
    targetPort: 8880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
        ports:
        - name: http
          containerPort: 9093
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 9093
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 20
        args:
        - --config.file=/etc/alertmanager/alertmanager.yaml
        - --storage.path=/var/lib/alertmanager
        - --cluster.listen-address=
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: data
          mountPath: /var/lib/alertmanager
      volumes:
      - name: config
        secret:
          # Operator-provisioned, required: alertmanager.yaml plus smtp-auth-password.
          # Build only from verified existing SMTP_HOST/PORT=587/USER/FROM,
          # SUPPORT_ALERT_TO and SMTP_APP_PASSWORD; never print them or use a dummy receiver.
          # alertmanager.yaml must use smtp_auth_password_file:
          # /etc/alertmanager/smtp-auth-password and smtp_require_tls: true.
          # Route all groups to the real support email receiver with send_resolved: true.
          # Missing/invalid destination remains a deployment blocker; no empty fallback.
          secretName: alertmanager-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
  - name: http
    port: 9093
    targetPort: 9093
