<main class="velura-auth-page" aria-label="Đặt lại mật khẩu Velura">
  <div class="login-page">
    <a class="logo-container" routerLink="/" aria-label="Về trang chủ Velura">
      <img src="/assets/images/auth/logo_velura.png" alt="Velura" class="logo" />
    </a>
    <img src="/assets/images/auth/model_main.png" alt="" class="main-model" aria-hidden="true" />

    <form class="login-container" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <nav class="back-link" aria-label="Điều hướng xác thực">
        <a routerLink="/auth/signin">
          <span aria-hidden="true">←</span>
          Quay lại đăng nhập
        </a>
      </nav>

      <header class="header">
        <h1>Đặt lại mật khẩu</h1>
        <p>Tạo mật khẩu mới an toàn cho tài khoản của bạn. Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số/ký tự đặc biệt.</p>
      </header>

      <div class="form-group">
        <label for="password-new">Mật khẩu mới <span class="field__required">*</span></label>
        <div class="input-wrapper">
          <input
            id="password-new"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Nhập mật khẩu mới"
            autocomplete="new-password"
          />
          <button class="toggle-password" type="button" aria-label="Hiển thị mật khẩu" (click)="showPassword.set(!showPassword())">
            <span aria-hidden="true">◉</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="password-confirm-reset">Xác nhận mật khẩu <span class="field__required">*</span></label>
        <div class="input-wrapper">
          <input
            id="password-confirm-reset"
            [type]="showConfirm() ? 'text' : 'password'"
            formControlName="password_confirm"
            placeholder="Xác nhận mật khẩu mới"
            autocomplete="new-password"
          />
          <button class="toggle-password" type="button" aria-label="Hiển thị mật khẩu" (click)="showConfirm.set(!showConfirm())">
            <span aria-hidden="true">◉</span>
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <div class="field__error" aria-live="polite">{{ errorMessage() }}</div>
      }
      @if (successMessage()) {
        <p class="input-hint">{{ successMessage() }}</p>
      }

      <button type="submit" class="btn-login" [disabled]="submitting()">Đặt lại mật khẩu</button>
    </form>
  </div>
</main>
