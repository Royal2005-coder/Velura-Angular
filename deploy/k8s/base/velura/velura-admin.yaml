apiVersion: apps/v1
kind: Deployment
metadata:
  name: velura-admin
  namespace: velura
  labels:
    app.kubernetes.io/name: velura-admin
    app.kubernetes.io/part-of: velura-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velura-admin
  template:
    metadata:
      labels:
        app: velura-admin
    spec:
      containers:
      - name: velura-admin
        image: ghcr.io/boygia757-netizen/velura-admin:latest
        imagePullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 80
        resources:
          requests:
            cpu: 30m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: velura-admin
  namespace: velura
  labels:
    app.kubernetes.io/name: velura-admin
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
      name: http
  selector:
    app: velura-admin
