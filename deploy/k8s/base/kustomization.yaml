apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - secrets
  - security/quotas.yaml
  - security/network-policies.yaml
  - database/postgres.yaml
  - database/backup.yaml
  - storage/s3-storage.yaml
  - storage/backup.yaml
  - auth/keycloak.yaml
  - observability/victoriametrics.yaml
  - observability/grafana.yaml
  - observability/grafana-dashboards.yaml
  - observability/litellm.yaml
  - observability/loki.yaml
  - observability/alloy.yaml
  - observability/alerts.yaml
  - observability/dcgm-exporter.yaml
  - networking/cloudflared.yaml
  - networking/oauth2-proxy.yaml

# Runtime config must be generated so a content change changes the referenced ConfigMap name and rolls the consumer.
configMapGenerator:
  - name: litellm-config
    namespace: observability
    files:
      - config.yaml=observability/litellm-config.yaml
  - name: victoriametrics-scrape-config
    namespace: observability
    files:
      - scrape.yaml=observability/config/victoriametrics-scrape.yaml
  - name: velura-alert-rules
    namespace: observability
    files:
      - rules.yaml=observability/config/alert-rules.yaml
  - name: alloy-config
    namespace: observability
    files:
      - config.alloy=observability/config/alloy-config.alloy
