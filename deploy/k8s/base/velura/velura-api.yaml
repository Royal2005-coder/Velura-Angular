apiVersion: v1
kind: ConfigMap
metadata:
  name: velura-api-config
  namespace: velura
data:
  NODE_ENV: production
  RELEASE_REVISION: b3df517c1daa2c4147ca7c5db0a32213a748c683
  PORT: '3000'
  CORS_ORIGIN: https://velura.royalai.dev,https://admin.royalai.dev,https://shop.royalai.dev
  STOREFRONT_ORIGIN: https://velura.royalai.dev
  S3_ENDPOINT: http://s3-service.storage.svc:9000
  LITELLM_ENDPOINT: http://litellm.observability.svc:4000
  GEMINI_MODEL: commerce-text
  GEMINI_STYLIST_MODEL: commerce-text
  GEMINI_EMBEDDING_MODEL: commerce-embedding
  LITELLM_IMAGE_MODEL: commerce-image-edit
  AI_CLUSTER_ENDPOINT: http://ai-worker.ai.svc:8000
  AI_ENGINE_MODE: cluster
  AI_ENABLE: 'false'
  AI_PRIVATE_ROOT: /app/scratch/ai-private
  VERCEL: '0'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-private-data
  namespace: velura
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velura-api
  namespace: velura
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: velura-api
  template:
    metadata:
      labels:
        app: velura-api
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-application
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: velura-api
        image: ghcr.io/royal2005-coder/velura-api:sha-b3df517c1daa2c4147ca7c5db0a32213a748c683@sha256:02fb777124f7457ea5e13306aa8a40ceda78a334492f45f350697d4adf8c91fe
        ports:
        - name: http
          containerPort: 3000
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 600m
            memory: 384Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
        envFrom:
        - configMapRef:
            name: velura-api-config
        - secretRef:
            name: velura-api-secrets
        env:
        - name: PRODUCTION_VERIFY_TOKEN
          valueFrom:
            secretKeyRef:
              name: velura-api-secrets
              key: PRODUCTION_VERIFY_TOKEN
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: velura-api-secrets
              key: LITELLM_API_KEY
        - name: AI_WORKER_KEY
          valueFrom:
            secretKeyRef:
              name: velura-api-secrets
              key: AI_WORKER_KEY
        - name: METRICS_SCRAPE_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: velura-api-secrets
              key: METRICS_SCRAPE_BEARER_TOKEN
        volumeMounts:
        - name: private
          mountPath: /app/scratch/ai-private
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: private
        persistentVolumeClaim:
          claimName: ai-private-data
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: velura-api
  namespace: velura
spec:
  type: ClusterIP
  selector:
    app: velura-api
  ports:
  - name: http
    port: 3000
    targetPort: 3000
