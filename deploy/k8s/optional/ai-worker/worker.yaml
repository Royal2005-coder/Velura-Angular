apiVersion: v1
kind: Namespace
metadata:
  name: ai-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.30
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: velura-inference-staging
value: 50
globalDefault: false
preemptionPolicy: Never
description: Optional inference must not preempt production workloads
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: worker-budget
  namespace: ai-staging
spec:
  hard:
    # Headroom = resident worker + the one-shot weights Job (250m/256Mi req, 1/512Mi lim).
    # At the old pods:'1' the Job pod is rejected by FailedCreate, so 3D weights can never be provisioned.
    requests.cpu: '2250m'
    limits.cpu: '5'
    requests.memory: 5376Mi
    limits.memory: 9728Mi
    requests.nvidia.com/gpu: '1'
    pods: '2'
    persistentvolumeclaims: '2'
    requests.storage: 20Gi
    services.nodeports: '0'
    services.loadbalancers: '0'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-worker-weights
  namespace: ai-staging
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-worker-private
  namespace: ai-staging
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-worker
  namespace: ai-staging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-worker
  template:
    metadata:
      labels:
        app: ai-worker
    spec:
      runtimeClassName: nvidia
      priorityClassName: velura-inference-staging
      imagePullSecrets:
        - name: velura-registry
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 210
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/royal2005-coder/velura-ai-worker@sha256:084eac4c4ff52b46058f33c851ac21c45c134fed4b29c124066f0921289e27fc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: '2'
              memory: 5Gi
              nvidia.com/gpu: '1'
            limits:
              cpu: '4'
              # The resident 2D pipeline measured 3.0 GiB; TripoSR adds ~1.6 GiB of weights plus render
              # buffers, and 6 GiB was memcg-OOM-killed on the cluster during the first stage attempt.
              memory: 9Gi
              nvidia.com/gpu: '1'
          env:
            - name: AI_WORKER_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-worker-auth
                  key: AI_WORKER_KEY
            - name: AI_WEIGHTS_DIR
              value: /weights
            # The patched tsr reads the DINO-ViT architecture from this directory instead of the hub; the pod has no egress.
            - name: TRIPOSR_IMAGE_TOKENIZER_CONFIG
              value: /weights/TripoSR/image_tokenizer
            # 2D and 3D alternate on one 8 GiB card; segment reuse stops fragmentation turning a 384 MiB
            # request into an OOM while gigabytes sat reserved-but-unallocated.
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: TMPDIR
              value: /private
          startupProbe:
            httpGet:
              path: /live
              port: http
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: weights
              mountPath: /weights
              readOnly: true
            - name: private
              mountPath: /private
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: ai-worker-weights
        - name: private
          persistentVolumeClaim:
            claimName: ai-worker-private
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-worker
  namespace: ai-staging
spec:
  type: ClusterIP
  selector:
    app: ai-worker
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ai-staging
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: ai-staging
spec:
  podSelector:
    matchLabels:
      app: ai-worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velura-staging
          podSelector:
            matchLabels:
              app: velura-api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: velura
          podSelector:
            matchLabels:
              app: velura-api
      ports:
        - protocol: TCP
          port: 8000
