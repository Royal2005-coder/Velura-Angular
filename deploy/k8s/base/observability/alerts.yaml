apiVersion: v1
kind: ConfigMap
metadata:
  name: velura-alert-rules
  namespace: observability
data:
  rules.yaml: "groups:\n- name: velura-production\n  interval: 30s\n  rules:\n  -\
    \ alert: ScrapeTargetDown\n    expr: up == 0\n    for: 5m\n    labels:\n     \
    \ severity: critical\n    annotations:\n      summary: 'Metrics target unavailable:\
    \ {{ $labels.job }}'\n  - alert: HttpErrorRate\n    expr: sum(rate(velura_http_requests_total{status=~\"\
    5..\"}[5m])) / clamp_min(sum(rate(velura_http_requests_total[5m])),\n      0.001)\
    \ > 0.05\n    for: 5m\n    labels:\n      severity: critical\n    annotations:\n\
    \      summary: API HTTP 5xx exceed 5%\n  - alert: HttpLatencyP95\n    expr: histogram_quantile(0.95,\
    \ sum by(le) (rate(velura_http_request_duration_seconds_bucket[5m])))\n      >\
    \ 2\n    for: 10m\n    labels:\n      severity: warning\n    annotations:\n  \
    \    summary: API p95 latency exceeds 2 seconds\n  - alert: LlmProviderErrors\n\
    \    expr: sum(rate(litellm_llm_api_failed_requests_metric_total[5m])) > 0.1\n\
    \    for: 5m\n    labels:\n      severity: warning\n    annotations:\n      summary:\
    \ LLM provider failure rate elevated\n  - alert: ContainerMemoryPressure\n   \
    \ expr: container_memory_working_set_bytes{container!=\"\",container!=\"POD\"\
    } / container_spec_memory_limit_bytes\n      > 0.9\n    for: 10m\n    labels:\n\
    \      severity: warning\n    annotations:\n      summary: Container using over\
    \ 90% memory limit\n  - alert: HttpMetricsMissing\n    expr: absent(velura_http_requests_total)\n\
    \    for: 10m\n    labels:\n      severity: critical\n    annotations:\n     \
    \ summary: HTTP metrics absent; monitoring contract broken\n  - alert: BackupTooOld\n\
    \    expr: time() - velura_backup_last_success_timestamp_seconds > 90000 or absent(velura_backup_last_success_timestamp_seconds)\n\
    \    for: 10m\n    labels:\n      severity: critical\n    annotations:\n     \
    \ summary: External backup evidence missing or older than 25 hours; operations\n\
    \        must verify backup jobs\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vmalert
        image: victoriametrics/vmalert:v1.104.0@sha256:a21e26fc334a4ba10bc69810c3b85000d852db5cd5e73269947c2732c272db36
        ports:
        - name: http
          containerPort: 8880
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8880
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8880
          initialDelaySeconds: 30
          periodSeconds: 20
        args:
        - -rule=/etc/vmalert/rules.yaml
        - -datasource.url=http://victoriametrics:8428
        - -remoteWrite.url=http://victoriametrics:8428
        - -remoteRead.url=http://victoriametrics:8428
        - -notifier.url=http://alertmanager:9093
        volumeMounts:
        - name: rules
          mountPath: /etc/vmalert
          readOnly: true
      volumes:
      - name: rules
        configMap:
          name: velura-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: vmalert
  ports:
  - name: http
    port: 8880
    targetPort: 8880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      priorityClassName: velura-platform
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
        ports:
        - name: http
          containerPort: 9093
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 9093
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 20
        args:
        - --config.file=/etc/alertmanager/alertmanager.yaml
        - --storage.path=/var/lib/alertmanager
        - --cluster.listen-address=
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: data
          mountPath: /var/lib/alertmanager
      volumes:
      - name: config
        secret:
          secretName: alertmanager-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
  - name: http
    port: 9093
    targetPort: 9093
