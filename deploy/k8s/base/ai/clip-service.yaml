apiVersion: v1
kind: Service
metadata:
  name: ai-clip
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-clip
    app.kubernetes.io/part-of: velura-infrastructure
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ai-clip
  namespace: ai
subsets:
  - addresses:
      - ip: 10.244.0.1
    ports:
      - port: 8000
        name: http
