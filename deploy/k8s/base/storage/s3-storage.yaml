apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s3-storage-pvc
  namespace: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-storage
  namespace: storage
  labels:
    app: s3-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-storage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: s3-storage
    spec:
      containers:
      - name: s3-server
        image: chrislusf/seaweedfs:latest
        imagePullPolicy: IfNotPresent
        command:
        - weed
        - server
        - -s3
        - -dir=/data
        - -s3.port=9000
        - -volume.max=50
        ports:
        - containerPort: 9000
          name: s3-api
        - containerPort: 8888
          name: web-filer
        - containerPort: 9333
          name: master
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        volumeMounts:
        - name: storage-data
          mountPath: /data
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
      - name: storage-data
        persistentVolumeClaim:
          claimName: s3-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: s3-service
  namespace: storage
spec:
  type: NodePort
  selector:
    app: s3-storage
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 30900
    name: s3-api
  - port: 8888
    targetPort: 8888
    nodePort: 30888
    name: web-filer
