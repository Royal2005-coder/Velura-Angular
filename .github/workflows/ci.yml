name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  npm_config_fund: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workspace and safe input contract
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          test -f apps/api/src/server.ts
          test -f apps/admin-ng/package.json
          test -f apps/user-ng/package.json
          if printf '%s\n' "$MESSAGE" "$TITLE" | grep -qiE '\[skip ci\]|\[ci skip\]'; then exit 1; fi
          if grep -R --exclude-dir=.git --exclude-dir=node_modules --include='*.pem' --include='*.key' -n 'BEGIN .*PRIVATE KEY' .; then exit 1; fi
          if grep -R --include='*.ts' -n '@ts-nocheck' apps/api; then exit 1; fi
      - name: Detect application release changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -qE '^(apps/|packages/|package(-lock)?\.json$|deploy/docker/)'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
  validate-pr-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production and PR contract
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          SRC: ${{ github.head_ref }}
          TGT: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$TGT" = main ] && [ "$SRC" != develop ]; then exit 1; fi
          printf '%s\n' "$TITLE" | grep -Eqi '^(Draft:[[:space:]]*)?KAN-[0-9]+'
          printf '%s\n' "$BODY" | grep -qiE '^[[:space:]]*##[[:space:]]*(Why|Tại sao)'
          case "$SRC" in feature/KAN-*|hotfix/KAN-*|develop) ;; *) exit 1;; esac
  test-api:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run typecheck:api
      - run: npm run test:api
      - run: node --test tools/ops/velura-ops.test.mjs
  test-angular:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run test:ng
  test-ai-worker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai-worker/requirements-test.txt
      - run: python -m pip install -r apps/ai-worker/requirements-test.txt
      - run: python -m unittest discover -s apps/ai-worker -p 'test_*.py'
  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run build:api && npm run build:user && npm run build:admin
  manifests:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version: '1.23.8', cache: false}
      - name: Install explicit manifest rendering dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Reject duplicate YAML keys and render each isolated overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          class UniqueLoader(yaml.SafeLoader):
              pass
          def mapping(loader, node, deep=False):
              keys = [loader.construct_object(key, deep=deep) for key, value in node.value]
              if len(keys) != len(set(keys)):
                  raise ValueError('Duplicate YAML mapping key')
              return yaml.SafeLoader.construct_mapping(loader, node, deep=deep)
          UniqueLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, mapping)
          paths = [Path('.github/workflows/ci.yml'), *Path('deploy/k8s').rglob('*.yaml')]
          for path in paths:
              list(yaml.load_all(path.read_text(), Loader=UniqueLoader))
          for path in ('deploy/k8s/overlays/staging', 'deploy/k8s/overlays/production', 'deploy/k8s/optional/ai-worker'):
              rendered = subprocess.run(['kustomize', 'build', path], check=True, capture_output=True, text=True).stdout
              objects = list(yaml.load_all(rendered, Loader=UniqueLoader))
              if not objects: raise ValueError('No rendered resources')
              for item in objects:
                  if item.get('kind') == 'ConfigMap':
                      for name, value in item.get('data', {}).items():
                          if name.endswith('.yaml'): list(yaml.load_all(value, Loader=UniqueLoader))
          PY
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Reject duplicate new migration numbers
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          numbers = [int(re.match(r'\d+', p.name)[0]) for p in Path('database/migrations').glob('*.sql') if re.match(r'\d+', p.name)]
          duplicates = [n for n,c in Counter(numbers).items() if n >= 25 and c > 1]
          if duplicates: raise SystemExit(f'Duplicate migrations: {duplicates}')
          PY
  note-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate-pr-contract, test-api, test-angular, test-ai-worker, build, migrations, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = '## Trace log (required CI note)';
            const body = `${marker}\n- Revision: ${context.sha}\n- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const args = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, args);
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...args, body});
  deploy-production:
    # Publishes artifacts only. Cluster changes occur only after a reviewed develop -> main promotion.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.publish == 'true'
    needs: [validate, test-api, test-angular, test-ai-worker, build, migrations, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, storefront, admin, ai-worker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Resolve canonical image repository
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${OWNER,,}/velura-$APP" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Resolve immutable worker Python base
        if: matrix.app == 'ai-worker'
        id: python
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect python:3.11.13-slim-bookworm --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=python:3.11.13-slim-bookworm@$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: build
        with:
          context: .
          file: deploy/docker/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            PYTHON_IMAGE=${{ steps.python.outputs.image }}
            RELEASE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan exact published digest
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: scan-${{ matrix.app }}.json
      - name: Generate SPDX SBOM for digest
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output: sbom-${{ matrix.app }}.json
          exit-code: '0'
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Sign and attest immutable release
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate "sbom-$APP.json" "$IMAGE"
          printf '%s\n' "$IMAGE" > "image-$APP.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.app }}
          path: |
            image-${{ matrix.app }}.txt
            scan-${{ matrix.app }}.json
            sbom-${{ matrix.app }}.json
          retention-days: 90
  promote-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.publish == 'true'
    needs: [validate, deploy-production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Open authenticated image update PR in this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          for app in ('api', 'storefront', 'admin', 'ai-worker'):
              image = Path(f'release/image-{app}.txt').read_text().strip()
              if not re.fullmatch(r'ghcr\.io/[a-z0-9_.-]+/velura-(?:api|storefront|admin|ai-worker)@sha256:[a-f0-9]{64}', image):
                  raise SystemExit('Invalid immutable image reference')
              paths = [Path('deploy/k8s/optional/ai-worker/worker.yaml'), Path('deploy/k8s/optional/ai-worker/provision-weights.yaml')] if app == 'ai-worker' else [Path(f'deploy/k8s/base/velura/velura-{app}.yaml')]
              for p in paths:
                  text, count = re.subn(r'(?m)^(\s*image:)\s+\S+', lambda m: m[1] + ' ' + image, p.read_text())
                  if count != 1: raise SystemExit('Expected exactly one application image')
                  if app == 'api':
                      text, count = re.subn(r'(?m)^  RELEASE_REVISION:.*$', '  RELEASE_REVISION: ' + os.environ['RELEASE_SHA'], text)
                      if count != 1: raise SystemExit('Missing release revision contract')
                  p.write_text(text)
          PY
          branch="feature/KAN-32-images-${RELEASE_SHA:0:12}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/k8s/base/velura deploy/k8s/optional/ai-worker/worker.yaml deploy/k8s/optional/ai-worker/provision-weights.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'KAN-32 why: promote scanned signed immutable application images'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --repo "$GH_REPO" --base develop --head "$branch" --title 'KAN-32: promote signed application image digests' --body "$(printf '## Why\nPromote immutable images built from approved main revision %s after Trivy, SPDX SBOM, and Cosign signing. Review then promote develop to main; no CI cluster credentials.' "$RELEASE_SHA")"
  verify-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.publish == 'false'
    needs: [validate, test-api, test-angular, test-ai-worker, build, migrations, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify independently provisioned staging application
        env:
          VERIFY_TOKEN: ${{ secrets.PRODUCTION_VERIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERIFY_TOKEN"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          expected=$(python -c "import re,pathlib; print(re.search(r'^  RELEASE_REVISION: (.+)$', pathlib.Path('deploy/k8s/base/velura/velura-api.yaml').read_text(), re.M)[1].strip())")
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 15 -H "Authorization: Bearer $VERIFY_TOKEN" -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" https://staging-admin.royalai.dev/api/ops/revision > staging-revision.json && jq -e --arg expected "$expected" '.ready == true and .revision == $expected' staging-revision.json; then
              curl --fail --silent --show-error --max-time 15 -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" https://staging.royalai.dev/ > /dev/null
              exit 0
            fi
            sleep 10
          done
          echo 'Staging revision did not converge' >&2
          exit 1
  verify-production:
    # Runs after the image update PR has been approved and promoted to main, not before it is deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.publish == 'false' && vars.VELURA_VERIFY_PRODUCTION == 'true'
    needs: [validate, test-api, test-angular, test-ai-worker, build, migrations, manifests, verify-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify actual read-only health and deployed application revision
        env:
          VERIFY_TOKEN: ${{ secrets.PRODUCTION_VERIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERIFY_TOKEN"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          expected=$(python -c "import re,pathlib; print(re.search(r'^  RELEASE_REVISION: (.+)$', pathlib.Path('deploy/k8s/base/velura/velura-api.yaml').read_text(), re.M)[1].strip())")
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 15 -H "Authorization: Bearer $VERIFY_TOKEN" -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" https://admin.royalai.dev/api/ops/revision > revision.json && jq -e --arg expected "$expected" '.ready == true and .revision == $expected' revision.json; then
              curl --fail --silent --show-error --max-time 15 https://velura.royalai.dev/api/health
              curl --fail --silent --show-error --max-time 15 https://velura.royalai.dev/ > /dev/null
              exit 0
            fi
            sleep 10
          done
          echo 'Production revision did not converge' >&2
          exit 1
