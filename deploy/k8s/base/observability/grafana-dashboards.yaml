apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: velura
        orgId: 1
        folder: Velura
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  overview.json: |
    {
      "uid":"velura-overview","title":"Velura / Overview and health","schemaVersion":39,"version":1,"editable":false,
      "tags":["velura","operations"],"timezone":"browser","refresh":"30s","time":{"from":"now-1h","to":"now"},
      "links":[{"title":"Workloads","url":"/d/velura-workloads"},{"title":"HTTP and LLM","url":"/d/velura-http-llm"},{"title":"Workload logs","url":"/d/velura-logs"}],
      "panels":[
        {"id":1,"type":"text","title":"Coverage is not readiness","gridPos":{"x":0,"y":0,"w":24,"h":4},"options":{"mode":"markdown","content":"Scrape success only proves metric access, not application readiness. Missing data is never converted to zero. API metrics need the collector bearer token matching the API; LiteLLM needs its real master key. Alert delivery needs an operator-provisioned Alertmanager receiver and an acknowledged test. Single-node storage is not HA or offsite backup. Node resource panels use cAdvisor root-cgroup and machine metrics; unavailable series must be investigated, not replaced with guessed values."}},
        {"id":2,"type":"stat","title":"Scrape health (1 = reachable)","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":4,"w":12,"h":6},"targets":[{"refId":"A","expr":"up","instant":true,"legendFormat":"{{job}} / {{instance}}"}],"fieldConfig":{"defaults":{"min":0,"max":1,"noValue":"No data","thresholds":{"mode":"absolute","steps":[{"color":"red","value":null},{"color":"green","value":1}]}}},"options":{"colorMode":"background","reduceOptions":{"calcs":["lastNotNull"],"values":false}}},
        {"id":3,"type":"table","title":"Active alerts (pending or firing)","description":"Empty means no active series, not proof of alert delivery; inspect vmalert scrape health too.","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":4,"w":12,"h":6},"targets":[{"refId":"A","expr":"ALERTS{alertstate=~\"pending|firing\"}","instant":true,"format":"table"}]},
        {"id":4,"type":"timeseries","title":"Node memory working set / physical memory","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":10,"w":8,"h":7},"targets":[{"refId":"A","expr":"max by(node) (container_memory_working_set_bytes{job=\"kubernetes-cadvisor\",id=\"/\"}) / on(node) max by(node) (machine_memory_bytes{job=\"kubernetes-cadvisor\"})","legendFormat":"{{node}}"}],"fieldConfig":{"defaults":{"unit":"percentunit","noValue":"No data","min":0}}},
        {"id":5,"type":"timeseries","title":"Node CPU cores used / physical cores","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":8,"y":10,"w":8,"h":7},"targets":[{"refId":"A","expr":"max by(node) (rate(container_cpu_usage_seconds_total{job=\"kubernetes-cadvisor\",id=\"/\"}[$__rate_interval])) / on(node) max by(node) (machine_cpu_cores{job=\"kubernetes-cadvisor\"})","legendFormat":"{{node}}"}],"fieldConfig":{"defaults":{"unit":"percentunit","noValue":"No data","min":0}}},
        {"id":6,"type":"timeseries","title":"Node filesystem space used","description":"cAdvisor root filesystem series are runtime-dependent; missing series trigger a coverage alert. This is not inode coverage.","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":16,"y":10,"w":8,"h":7},"targets":[{"refId":"A","expr":"max by(node,device) (container_fs_usage_bytes{job=\"kubernetes-cadvisor\",id=\"/\"}) / on(node,device) (max by(node,device) (container_fs_limit_bytes{job=\"kubernetes-cadvisor\",id=\"/\"}) > 0)","legendFormat":"{{node}} / {{device}}"}],"fieldConfig":{"defaults":{"unit":"percentunit","noValue":"No data","min":0}}},
        {"id":7,"type":"timeseries","title":"Last successful external backup age","description":"Requires the real backup evidence exporter; absent data is a missing production prerequisite, not a successful backup.","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":17,"w":12,"h":7},"targets":[{"refId":"A","expr":"time() - velura_backup_last_success_timestamp_seconds","legendFormat":"{{job}}"}],"fieldConfig":{"defaults":{"unit":"s","noValue":"No backup evidence"}}},
        {"id":8,"type":"timeseries","title":"Scraped samples by target","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":17,"w":12,"h":7},"targets":[{"refId":"A","expr":"scrape_samples_scraped","legendFormat":"{{job}} / {{instance}}"}]}
      ]
    }
  workloads.json: |
    {
      "uid":"velura-workloads","title":"Velura / Workloads","schemaVersion":39,"version":1,"editable":false,
      "tags":["velura","kubernetes"],"timezone":"browser","refresh":"30s","time":{"from":"now-1h","to":"now"},
      "templating":{"list":[
        {"name":"namespace","label":"Namespace","type":"query","datasource":{"type":"prometheus","uid":"velura-metrics"},"query":"label_values(container_memory_working_set_bytes{job=\"kubernetes-cadvisor\",container!=\"\",container!=\"POD\",namespace!=\"\"}, namespace)","refresh":1,"multi":true,"includeAll":true,"allValue":".+","current":{"text":"All","value":"$__all"}},
        {"name":"pod","label":"Pod","type":"query","datasource":{"type":"prometheus","uid":"velura-metrics"},"query":"label_values(container_memory_working_set_bytes{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",container!=\"\",container!=\"POD\"}, pod)","refresh":1,"multi":true,"includeAll":true,"allValue":".+","current":{"text":"All","value":"$__all"}}
      ]},
      "panels":[
        {"id":1,"type":"text","title":"Measured containers, not deployment readiness","gridPos":{"x":0,"y":0,"w":24,"h":3},"options":{"mode":"markdown","content":"Uses kubelet cAdvisor only; no kube-state-metrics or GPU exporter is installed by this dashboard. Deployment desired/available replicas, pod restart counters, allocatable request ratios and GPU utilization are intentionally not invented. Memory limits reflect runtime cgroups, not scheduler requests. Use the owner ops CLI for readiness and rollout evidence."}},
        {"id":2,"type":"timeseries","title":"CPU cores used","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":3,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(namespace,pod,container) (rate(container_cpu_usage_seconds_total{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[$__rate_interval]))","legendFormat":"{{namespace}} / {{pod}} / {{container}}"}],"fieldConfig":{"defaults":{"unit":"cores","noValue":"No data"}}},
        {"id":3,"type":"timeseries","title":"Memory working set","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":3,"w":12,"h":7},"targets":[{"refId":"A","expr":"max by(namespace,pod,container) (container_memory_working_set_bytes{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"})","legendFormat":"{{namespace}} / {{pod}} / {{container}}"}],"fieldConfig":{"defaults":{"unit":"bytes","noValue":"No data"}}},
        {"id":4,"type":"timeseries","title":"Memory working set / finite cgroup limit","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":10,"w":12,"h":7},"targets":[{"refId":"A","expr":"max by(node,namespace,pod,container) (container_memory_working_set_bytes{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}) / on(node,namespace,pod,container) (max by(node,namespace,pod,container) (container_spec_memory_limit_bytes{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}) > 0 < 1e15)","legendFormat":"{{namespace}} / {{pod}} / {{container}}"}],"fieldConfig":{"defaults":{"unit":"percentunit","noValue":"No finite limit data"}}},
        {"id":5,"type":"timeseries","title":"CPU throttled periods / total periods","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":10,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(namespace,pod,container) (rate(container_cpu_cfs_throttled_periods_total{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[$__rate_interval])) / sum by(namespace,pod,container) (rate(container_cpu_cfs_periods_total{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[$__rate_interval]))","legendFormat":"{{namespace}} / {{pod}} / {{container}}"}],"fieldConfig":{"defaults":{"unit":"percentunit","noValue":"No data"}}},
        {"id":6,"type":"timeseries","title":"OOM events over 15 minutes","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":17,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(namespace,pod,container) (increase(container_oom_events_total{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[15m]))","legendFormat":"{{namespace}} / {{pod}} / {{container}}"}]},
        {"id":7,"type":"timeseries","title":"Observed container age","description":"Runtime start time, not a Kubernetes restart counter.","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":17,"w":12,"h":7},"targets":[{"refId":"A","expr":"time() - max by(namespace,pod,container) (container_start_time_seconds{job=\"kubernetes-cadvisor\",namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"})","legendFormat":"{{namespace}} / {{pod}} / {{container}}"}],"fieldConfig":{"defaults":{"unit":"s","noValue":"No data"}}}
      ]
    }
  http-llm.json: |
    {
      "uid":"velura-http-llm","title":"Velura / HTTP and LLM","schemaVersion":39,"version":1,"editable":false,
      "tags":["velura","api","llm"],"timezone":"browser","refresh":"30s","time":{"from":"now-1h","to":"now"},
      "panels":[
        {"id":1,"type":"text","title":"Instrumented routes and real usage only","gridPos":{"x":0,"y":0,"w":24,"h":4},"options":{"mode":"markdown","content":"HTTP status labels are classes (2xx/5xx); health, ready and metrics routes are excluded from business traffic. AI gateway series are emitted after actual use and never require synthetic paid inference. API credential failure appears as up{job=\"velura-http\"}=0. Token/cost coverage counters distinguish unreported usage from measured zero. No guessed cost, native gateway failure metric, GPU telemetry or end-to-end availability is shown. The installed API must expose the genuine cumulative HTTP histogram before its approximate p95 can be trusted."}},
        {"id":2,"type":"timeseries","title":"Business HTTP requests / second","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":4,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(route,status) (rate(velura_http_requests_total{job=\"velura-http\",route!~\"/(health|ready|metrics)\"}[$__rate_interval]))","legendFormat":"{{route}} / {{status}}"}],"fieldConfig":{"defaults":{"unit":"reqps","noValue":"No data"}}},
        {"id":3,"type":"timeseries","title":"Business HTTP approximate p95 latency","description":"Valid only for genuine cumulative duration buckets from apps/api/src/ops-runtime.ts. Confirm the installed API image matches this contract; never interpret synthetic buckets as latency observations.","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":4,"w":12,"h":7},"targets":[{"refId":"A","expr":"histogram_quantile(0.95, sum by(le,route) (rate(velura_http_request_duration_seconds_bucket{job=\"velura-http\",route!~\"/(health|ready|metrics)\"}[$__rate_interval])))","legendFormat":"{{route}}"}],"fieldConfig":{"defaults":{"unit":"s","noValue":"No traffic / no data"}}},
        {"id":4,"type":"timeseries","title":"AI gateway requests and failures / second","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":11,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(operation) (rate(velura_ai_requests_total{job=\"velura-http\"}[$__rate_interval]))","legendFormat":"{{operation}} requests"},{"refId":"B","expr":"sum by(operation) (rate(velura_ai_failures_total{job=\"velura-http\"}[$__rate_interval]))","legendFormat":"{{operation}} failures"}]},
        {"id":5,"type":"timeseries","title":"AI gateway mean latency","description":"Sum / observed requests, not a fabricated percentile.","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":11,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(operation) (rate(velura_ai_duration_seconds_sum{job=\"velura-http\"}[$__rate_interval])) / sum by(operation) (rate(velura_ai_requests_total{job=\"velura-http\"}[$__rate_interval]))","legendFormat":"{{operation}}"}],"fieldConfig":{"defaults":{"unit":"s","noValue":"No measured requests"}}},
        {"id":6,"type":"timeseries","title":"Reported input / output tokens per second","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":18,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(operation) (rate(velura_ai_input_tokens_total{job=\"velura-http\"}[$__rate_interval]))","legendFormat":"{{operation}} input"},{"refId":"B","expr":"sum by(operation) (rate(velura_ai_output_tokens_total{job=\"velura-http\"}[$__rate_interval]))","legendFormat":"{{operation}} output"}]},
        {"id":7,"type":"timeseries","title":"Usage / cost reporting coverage","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":18,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(operation) (increase(velura_ai_usage_measurements_total{job=\"velura-http\"}[1h]))","legendFormat":"{{operation}} usage observations"},{"refId":"B","expr":"sum by(operation) (increase(velura_ai_cost_measurements_total{job=\"velura-http\"}[1h]))","legendFormat":"{{operation}} cost observations"}]},
        {"id":8,"type":"timeseries","title":"Reported AI cost / hour (USD)","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":25,"w":12,"h":7},"targets":[{"refId":"A","expr":"sum by(operation) (increase(velura_ai_cost_usd_total{job=\"velura-http\"}[1h]))","legendFormat":"{{operation}}"}],"fieldConfig":{"defaults":{"unit":"currencyUSD","noValue":"No reported cost"}}},
        {"id":9,"type":"timeseries","title":"LiteLLM protected metrics access","description":"1 means the protected metrics endpoint was scraped successfully, not model readiness or provider success. API operation failures above are the confirmed application metric contract.","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":12,"y":25,"w":12,"h":7},"targets":[{"refId":"A","expr":"up{job=\"litellm\"}","legendFormat":"gateway scrape"}],"fieldConfig":{"defaults":{"min":0,"max":1,"noValue":"No gateway scrape"}}}
      ]
    }
  logs.json: |
    {
      "uid":"velura-logs","title":"Velura / Workload logs","schemaVersion":39,"version":1,"editable":false,
      "tags":["velura","loki"],"timezone":"browser","refresh":"30s","time":{"from":"now-15m","to":"now"},
      "templating":{"list":[
        {"name":"namespace","label":"Namespace","type":"query","datasource":{"type":"loki","uid":"velura-logs"},"query":"label_values({job=\"kubernetes-pods\"}, namespace)","refresh":1,"multi":true,"includeAll":true,"allValue":".+","current":{"text":"All","value":"$__all"}},
        {"name":"pod","label":"Pod","type":"query","datasource":{"type":"loki","uid":"velura-logs"},"query":"label_values({job=\"kubernetes-pods\",namespace=~\"$namespace\"}, pod)","refresh":1,"multi":true,"includeAll":true,"allValue":".+","current":{"text":"All","value":"$__all"}},
        {"name":"container","label":"Container","type":"query","datasource":{"type":"loki","uid":"velura-logs"},"query":"label_values({job=\"kubernetes-pods\",namespace=~\"$namespace\",pod=~\"$pod\"}, container)","refresh":1,"multi":true,"includeAll":true,"allValue":".+","current":{"text":"All","value":"$__all"}}
      ]},
      "panels":[
        {"id":1,"type":"text","title":"Private operational logs","gridPos":{"x":0,"y":0,"w":24,"h":4},"options":{"mode":"markdown","content":"Alloy supplies namespace/pod/container/node/job labels from Kubernetes metadata only. Log bodies and arbitrary parsed fields are not index labels. This view intentionally excludes legacy unlabeled Promtail streams. Restrict Grafana and Loki access; do not copy raw bodies into tickets or acceptance evidence. Empty logs may mean an idle workload, missing collection, or an incorrect selector; it does not prove health."}},
        {"id":2,"type":"timeseries","title":"Log lines / second by workload","datasource":{"type":"loki","uid":"velura-logs"},"gridPos":{"x":0,"y":4,"w":24,"h":7},"targets":[{"refId":"A","expr":"sum by(namespace,pod,container) (rate({job=\"kubernetes-pods\",namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\"}[$__auto]))","legendFormat":"{{namespace}} / {{pod}} / {{container}}","queryType":"range"}]},
        {"id":4,"type":"timeseries","title":"Collector sent / dropped log entries per second","description":"Delivery counters are independent of Alloy component readiness. An idle stream has no send rate; missing counters require investigation.","datasource":{"type":"prometheus","uid":"velura-metrics"},"gridPos":{"x":0,"y":25,"w":24,"h":7},"targets":[{"refId":"A","expr":"sum(rate(loki_write_sent_entries_total{job=\"alloy\"}[$__rate_interval]))","legendFormat":"sent"},{"refId":"B","expr":"sum(rate(loki_write_dropped_entries_total{job=\"alloy\"}[$__rate_interval]))","legendFormat":"dropped"}],"fieldConfig":{"defaults":{"noValue":"No delivery metrics"}}},
        {"id":3,"type":"logs","title":"Selected workload logs","datasource":{"type":"loki","uid":"velura-logs"},"gridPos":{"x":0,"y":11,"w":24,"h":14},"targets":[{"refId":"A","expr":"{job=\"kubernetes-pods\",namespace=~\"$namespace\",pod=~\"$pod\",container=~\"$container\"}","queryType":"range","maxLines":200}],"options":{"showTime":true,"showLabels":false,"showCommonLabels":true,"wrapLogMessage":true,"sortOrder":"Descending","dedupStrategy":"none","enableLogDetails":true}}
      ]
    }
