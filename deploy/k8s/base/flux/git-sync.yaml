apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: velura-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/Royal2005-coder/Velura-Angular.git
  ref:
    branch: main
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: velura-staging-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/Royal2005-coder/Velura-Angular.git
  ref:
    branch: develop
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velura-infra
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: velura-repo
  path: ./deploy/k8s/overlays/infrastructure
  # One-time bootstrap gate; resume only after the stateful drift review.
  suspend: true
  prune: true
  deletionPolicy: Orphan
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velura-production
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: velura-repo
  path: ./deploy/k8s/overlays/production
  dependsOn:
    - name: velura-infra
  suspend: true
  prune: true
  deletionPolicy: Orphan
  wait: true
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velura-staging
  namespace: flux-system
spec:
  interval: 2m
  sourceRef:
    kind: GitRepository
    name: velura-staging-repo
  path: ./deploy/k8s/overlays/staging
  dependsOn:
    - name: velura-infra
  suspend: true
  prune: true
  deletionPolicy: Orphan
  wait: true
  timeout: 5m
