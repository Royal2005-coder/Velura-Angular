apiVersion: batch/v1
kind: CronJob
metadata:
  name: storage-external-backup
  namespace: storage
spec:
  schedule: 45 2 * * *
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: storage-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          priorityClassName: velura-batch
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
          - name: external-object-copy
            image: rclone/rclone:1.71.1@sha256:d5971950c2b370fb04dd3292541b5bda6d9103143fd7e345aeb435a399388afc
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            command:
            - sh
            - -ec
            args:
            - |
              umask 077
              stamp=$(date -u +%Y%m%dT%H%M%SZ)
              rclone --config=/etc/rclone/rclone.conf copy seaweed: "external:velura-backups/objects/$stamp" --checksum
              rclone --config=/etc/rclone/rclone.conf check seaweed: "external:velura-backups/objects/$stamp" --one-way --download
              # Counts/bytes are sufficient; never enumerate private object keys in job logs.
              rclone --config=/etc/rclone/rclone.conf size "external:velura-backups/objects/$stamp" --json
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: config
              mountPath: /etc/rclone
              readOnly: true
          volumes:
          - name: config
            secret:
              secretName: storage-external-backup
              defaultMode: 0440
              items:
              - key: rclone.conf
                path: rclone.conf
