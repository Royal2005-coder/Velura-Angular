upstream velura_api {
  server 127.0.0.1:8787;
  keepalive 16;
}

# Cloudflare terminates visitor TLS. Origin must NOT 301 HTTP→HTTPS:
# Flexible + Always Use HTTPS + origin 301 = ERR_TOO_MANY_REDIRECTS.
# Port 80 serves the SPA for Flexible; port 443 serves Full / Full Strict.

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name velura.royalai.dev;

  ssl_certificate     /etc/nginx/ssl/velura.crt;
  ssl_certificate_key /etc/nginx/ssl/velura.key;

  root /var/www/velura/user;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location /api/ {
    proxy_pass http://velura_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location = /api {
    return 302 /api/;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8787/health;
  }

  location = /api/health {
    proxy_pass http://127.0.0.1:8787/health;
  }

  location /supabase/ {
    proxy_pass https://gtyuajboeffmfskofoyh.supabase.co/;
    proxy_ssl_server_name on;
    proxy_set_header Host gtyuajboeffmfskofoyh.supabase.co;
  }

  location = /admin {
    return 302 https://admin.royalai.dev/login;
  }

  location /admin/ {
    return 302 https://admin.royalai.dev$request_uri;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

