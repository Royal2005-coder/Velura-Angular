<section class="delivery-simulation" aria-label="Hành trình giao hàng mô phỏng">
  <div class="map-heading">
    <div><span class="demo-label">Mô phỏng</span><h3>Hành trình giao hàng</h3></div>
    <span class="delivery-status">{{ delivered() ? 'Đơn đã giao thành công' : 'Đơn đang giao hàng' }}</span>
  </div>
  <p class="map-note">Đơn {{ orderCode() }} · {{ destination() }}. Bản đồ minh họa trải nghiệm, không phải vị trí GPS thực tế.</p>
  <svg viewBox="0 0 392 230" role="img" aria-label="Tuyến minh họa từ kho Velura qua trạm trung chuyển đến khu vực nhận hàng">
    <rect width="392" height="230" rx="12" fill="#f7f5ef" />
    <path d="M0 40H392M0 116H392M0 198H392M80 0V230M198 0V230M302 0V230" stroke="#fff" stroke-width="18" />
    <path d="M15 15H62V65H15ZM218 14H270V55H218ZM312 174H372V216H312Z" fill="#e4ecd9" />
    <path d="M99 25H166V64H99ZM153 172H214V209H153ZM325 72H370V113H325Z" fill="#e8dfd4" />
    <path d="M42 152H132V86H250V152H350" fill="none" stroke="#e0cec0" stroke-width="9" stroke-linejoin="round" />
    <path d="M42 152H132V86H250V152H350" fill="none" stroke="#986b52" stroke-width="3" stroke-dasharray="7 6" />
    <circle cx="42" cy="152" r="9" fill="#77533f" stroke="#fff" stroke-width="3" />
    <circle cx="190" cy="86" r="7" fill="#b18b6e" stroke="#fff" stroke-width="3" />
    <circle cx="350" cy="152" r="9" fill="#628052" stroke="#fff" stroke-width="3" />
    <text x="18" y="179">Kho Velura</text><text x="140" y="64">Trạm trung chuyển</text><text x="275" y="179">Khu vực nhận hàng</text>
    <g class="driver" [attr.transform]="position()"><circle r="14" fill="#fff" stroke="#986b52" stroke-width="2" /><path d="M-8 2V-5H3V2H-8ZM3-3H6L9 0V2H3" fill="#77533f" /><circle cx="-4" cy="4" r="2" fill="#77533f" /><circle cx="6" cy="4" r="2" fill="#77533f" /></g>
  </svg>
  <div class="map-footer"><p>Trạng thái giao hàng được cập nhật từ hệ thống đơn hàng.</p>
    @if (!delivered()) { <button type="button" (click)="toggle()">{{ running() ? 'Tạm dừng mô phỏng' : progress() >= 95 ? 'Xem lại mô phỏng' : 'Xem mô phỏng' }}</button> }
  </div>
</section>
